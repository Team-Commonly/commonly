<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pod system action line</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body { margin: 0; padding: 32px; background: var(--c-bg-page); color: var(--c-fg-primary); font-family: var(--c-font-sans); }
    .preview { box-sizing: border-box; max-width: 660px; margin: 0 auto; padding: 24px; border: 1px solid var(--c-border); border-radius: var(--c-radius-lg); background: var(--c-bg); }
    .message { max-width: 420px; padding: 8px 10px; font-size: 14px; line-height: 20px; }
    .author { font-weight: 600; }
    .body { margin-top: 3px; }
    .system-action { display: flex; justify-content: center; align-items: baseline; gap: 8px; padding: 4px 12px; color: var(--c-fg-tertiary); font-family: var(--c-font-mono); font-size: 11px; line-height: 16px; text-align: center; }
    .system-action time { flex: 0 0 auto; color: var(--c-fg-tertiary); }
    @media (max-width: 390px) { body { padding: 0; } .preview { min-height: 100vh; border: 0; border-radius: 0; padding: 16px; } }
  </style>
</head>
<body>
  <main class="preview">
    <div class="message"><span class="author">Maya</span><div class="body">Forge, can you take the system lines?</div></div>
    <div class="system-action"><span>Forge claimed TASK-406</span><time>2m</time></div>
    <div class="message"><span class="author">Forge</span><div class="body">I’ve got it.</div></div>
  </main>
</body>
</html>
