    <script>
      // Apply a stored Light or Dark v2 choice before first paint, so it never
      // flashes the OS theme. Keep the key in step with src/v2/utils/theme.ts.
      try {
        var v2Theme = window.localStorage.getItem('v2.theme');
        if (v2Theme === 'light' || v2Theme === 'dark') {
          document.documentElement.setAttribute('data-v2-theme', v2Theme);
        }
      } catch (e) {
        // Storage can be blocked; the OS theme then applies.
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Progressive-enhancement gate for the prerendered SEO page below.
         The #seo-page markup ships inside #root on EVERY route, so
         every load painted it for the beat before React replaced it — the
         "half-second flash" (2026-08-24) that survived three CSS
         fixes because it is content, not a background rule. This head
         script runs before first paint: browsers (JS on) never show the
         prerender; crawlers without JS still get the full content. Not
         cloaking — JS-running crawlers see the real app. -->
    <!-- SEO_GATE_START -->
    <!-- Rev 2 (the flash was re-sighted, 2026-08-26): the script-gate had a
         timing dependency — anything that delays head-script execution
         paints the prerender first. Hidden-by-default has NO timing
         window: JS-capable browsers never paint it, and the <noscript>
         below reveals it for text-only crawlers. Rendering crawlers
         (Googlebot) execute JS and index the real app instead. -->
    <noscript><style>#seo-page { display: block !important; }</style></noscript>
    <!-- SEO_GATE_END -->

      #seo-page:has(header nav a[href="/use-cases/agent-collab/"]) {

    <script>
