# values-staging.yaml — the staging release of Commonly.
#
# Staging is a SECOND Helm release of this same chart, in its own namespace
# (commonly-staging), reading its own secrets, with its own Cloudflare tunnel.
# It exists so we can build and deploy recklessly without touching prod
# (commonly-dev). It is layered on the OSS base: `helm ... -f values.yaml
# -f values-staging.yaml` (applied last). It deliberately does NOT inherit
# values-dev.yaml — the prod overrides stay prod's.
#
# PUBLIC-REPO HYGIENE (R12): this file carries NO project ID, NO Workload
# Identity service-account email, and NO Aiven/Atlas host. Those are supplied at
# deploy time from .dev/values-private*.yaml (materialized from GitHub Actions
# secrets), exactly as the prod deploy does. Image tags are injected per merged
# SHA by deploy-staging.yml, so none are pinned here.
#
# The Cloudflare tunnel (staging.commonly.me / api-staging.commonly.me routing
# straight to the staging Services, no ingress-nginx) is provisioned by the
# dedicated Thu tunnel task; cloudflared is left disabled here until that lands.

global:
  namespace: commonly-staging

# First install runs `helm upgrade --install --create-namespace`, so the chart
# must NOT also emit a Namespace object — it would fight helm for ownership of
# commonly-staging. Same reason values-local.yaml disables it. Prod keeps its
# chart-managed namespace (createNamespace defaults true in values.yaml).
createNamespace: false

externalSecrets:
  enabled: true
  # Staging reads commonly-staging-NAME keys, disjoint from prod's commonly-dev-.
  keyPrefix: commonly-staging-
  # Staging's cloudflared runs in its own namespace, so it uses the namespaced
  # SecretStore — no cross-namespace ClusterSecretStore is rendered.
  clusterSecretStore:
    enabled: false

# No Discord app for staging: the backend gets no DISCORD_* env and api-keys
# references none of the commonly-staging-discord-* keys.
discord:
  enabled: false

# No SMTP2GO for staging. api-keys references none of the commonly-staging-SMTP2GO_*
# keys; with SMTP2GO_API_KEY unset (the backend env refs are optional) the backend
# auto-verifies new signups rather than waiting on a mail it cannot send. Deliberately
# NOT placeholder values — a non-empty key would make the backend think email works.
email:
  enabled: false

# No prod GitHub PAT on staging. The shared commonly-github-pat has write power over
# prod repos, and staging auto-deploys every merge (the reckless lane), so the
# api-keys render must not reference it (the same principle as
# keeping atlasAdmin off staging). The backend uses GitHub App installation tokens
# and does not read this key. If staging agents ever need git, that is a
# separate fine-grained PAT on a throwaway repo, post-11/1.
githubPat:
  enabled: false

# Staging renders NO Ingress object. A staging Ingress would be picked up by the
# single shared ingress-nginx controller and reload prod routing (R1). Staging
# is reached only through its own cloudflared tunnel, straight to Services.
ingress:
  enabled: false

# Cloudflared routes staging's own hostnames straight to the staging Services on the
# commonly-staging tunnel (no ingress-nginx; R1). Per-hostname ingressRules, so
# staging.commonly.me -> frontend and api-staging.commonly.me -> backend. It runs IN
# commonly-staging, so credentials come from a namespaced ExternalSecret sourcing
# commonly-staging-cloudflared-credentials. The tunnelId is NOT committed (R12) — it
# is supplied from the staging private values at deploy.
cloudflared:
  enabled: true
  namespace: commonly-staging
  credentialsSecretName: cloudflared-commonly-staging
  credentialsKey: commonly-staging-cloudflared-credentials
  replicas: 1
  ingressRules:
    - hostname: staging.commonly.me
      service: http://frontend:80
    - hostname: api-staging.commonly.me
      service: http://backend:5000
  nodeSelector:
    workload-tier: spot
  tolerations:
    - effect: NoSchedule
      key: workload-tier
      operator: Equal
      value: spot

# clawdbot-gateway (openclaw moltbot) is OFF in staging. Prod has no clawdbot-gateway
# Deployment either — prod runs backend, commonly-bot, frontend, litellm and redis — so
# staging matches. Disabling it also drops its two PVCs (clawdbot-config / clawdbot-
# workspace, which never Bound in the first install attempt) and the gateway's CPU.
# Hosted agents answer through litellm (native runtime), not this gateway; if the Fri
# walk needs a live moltbot inside a staging pod, enable one right-sized replica.
agents:
  clawdbot:
    enabled: false
    # The gateway Deployment/Service gate on `enabled`, but its two PVCs gate on
    # these separate persistence flags (default true) — leaving them on would re-create
    # the unbound clawdbot-config / clawdbot-workspace PVCs that stalled the first
    # install (no consumer, never Bound). Off here so the gateway leaves nothing behind.
    persistence:
      config:
        enabled: false
      workspace:
        enabled: false

# LiteLLM — ENABLED for staging (SRE 2026-10-31). Staging native agents answer through
# the native runtime -> LiteLLM, exactly as prod does; the values-staging comment above
# ("Hosted agents answer through litellm") assumed this but the stanza was missing, so
# litellm inherited the base default (enabled:false). The staging backend still pointed
# native-runtime turns at http://litellm:4000 — nonexistent in this namespace — so every
# Scout ONBOARDING-REPLY turn failed ("native runtime failed: turn failed", model
# undefined, no cost) while the scripted welcome still posted. That was the 2026-10-31
# staging-walk incident (Sam: "is scout not working? I saw it not responding in staging").
#
# Kept deliberately small (spend approved by Cofounder for Sam's checks + dev:live
# screenshots):
#   - MASTER KEY ONLY (serviceKeys.fromSecret:false): no budgeted virtual keys to mint
#     in Secret Manager. The cost ceiling is the shared litellm-config's deepseek-v4-flash
#     group max_budget ($60/1mo), metered in THIS instance's router cache, independent of
#     prod's litellm instance.
#   - CODEX OFF (codexAuthRotator.enabled:false): staging carries no Codex traffic. Scout
#     runs on deepseek-v4-flash (backend LITELLM_CHAT_MODEL), the cheapest route it works
#     on. The codex-cli sidecar + codex-auth-seed init still render (ungated in the
#     template) but idle harmlessly — the seed writes an empty auth.json and exits 0.
#   - NO chatgpt-auth PVC (emptyDir): nothing to persist without Codex.
#   - default-pool (untainted, NOT prod's dev-pool, NOT spot): Scout must stay up for
#     Sam's checks, so it must not be reclaimed mid-walk the way the spot-pool (which the
#     rest of staging rides) can be. It is NOT pinned to the shared cluster's dev-pool
#     either: that is a SINGLE node already running prod litellm + clawdbot + cloud-codex,
#     and pinning the reckless staging lane there would let it pressure the one node
#     serving PROD agent runtimes (the staging->prod blast-radius this whole file avoids).
#     The default-pool is two untainted nodes with headroom for this small pod (requests
#     120m CPU / 576Mi; a default-pool node had ~377m CPU free when measured), isolated
#     from prod and stable. (The codex-cli sidecar + codex-auth-seed init still render
#     ungated in the shared template but do not gate litellm readiness or block Scout;
#     gating them on codex-enabled is a follow-up — TASK filed.)
#
# No new secret and no new database: every key litellm needs already exists in the
# staging api-keys ring (deepseek-api-key, cloudflare-account-id/-workers-ai-token,
# gemini/openrouter/openai-api-key, litellm-master-key — all unconditional in the
# ExternalSecret), and DATABASE_URL reuses staging's own Aiven Postgres via
# ?schema=litellm. Guard test: backend/__tests__/unit/helm/litellmStagingEnabled.test.js.
litellm:
  enabled: true
  serviceKeys:
    fromSecret: false
  codexAuthRotator:
    enabled: false
  chatgptAuth:
    persistence:
      enabled: false
  # No tolerations + pool=default => the untainted default-pool ONLY (both dev-pool and
  # spot-pool are tainted, so an untolerated pod cannot land on either). See the
  # default-pool rationale in the block comment above.
  nodeSelector:
    pool: default

backend:
  env:
    # injection-guard ONLY — matches prod (values-dev.yaml). The native runtime's
    # default guardrail pair (nativeRuntimeService.ts) includes openai-moderation-enforce,
    # which calls OpenAI's moderation API with OPENAI_API_KEY. Staging's api-keys
    # openai-api-key is an 11-byte placeholder (prod's is the literal "placeholder" too),
    # so that guardrail 401'd on EVERY native turn BEFORE the model call — litellm logged
    # 401 from https://api.openai.com/v1/moderations and returned HTTP 401 for
    # deepseek-v4-flash. This was the second half of the 2026-10-31 Scout-staging incident:
    # enabling litellm (above) fixed the missing-backend 401, this fixes the guardrail 401.
    # injection-guard is LiteLLM-native (no key, no external service) and keeps the
    # prompt-injection block. Restore the pair only after a real OpenAI moderation key
    # lands in the staging api-keys secret. Guard test: litellmStagingEnabled.test.js.
    nativeRuntimeGuardrails: "injection-guard"
    agentComputerEnabled: "true"
    agentComputerSteelApiUrlTemplate: "http://steel-{userId}.commonly-staging.svc.cluster.local:3000"
    agentComputerSteelCdpUrlTemplate: "http://steel-{userId}.commonly-staging.svc.cluster.local:9223"
    agentComputerAllowedHosts: "linkedin.com,www.linkedin.com"
    # Team-only staging sign-in. Any value flips isInstanceAccessRestricted()
    # true and gates BOTH register and login; prod (values-dev) sets neither and
    # stays public. Domains cover the seed accounts (@seed.staging.commonly.me) and
    # both CI smoke accounts (@ops.commonly.invalid) so staging-smoke stays green.
    # Individual team emails are PII and live in the GCP SM secret
    # commonly-staging-auth-allowed-emails (NOT in this repo), surfaced via the
    # api-keys ExternalSecret → AUTH_ALLOWED_EMAILS when the flag below is true.
    authAllowedDomains: "seed.staging.commonly.me,ops.commonly.invalid,example.invalid"
    authAllowedEmailsFromSecret: true
    # Smaller Postgres pool for staging's Aiven db (fewer connections than prod).
    pgPoolMax: 5
    # Non-secret db name; host/user/password come from the private values +
    # the database-credentials secret created by the Thu staging-secrets task.
    pgDatabase: commonly_staging
    # Staging's browser origin is staging.commonly.me, not prod's commonly.me. The backend
    # builds its CORS allowlist from FRONTEND_URL (server.ts buildAllowedOrigins); the chart
    # default (values.yaml) is https://commonly.me, so WITHOUT this override the staging backend
    # rejects every cross-origin request from staging.commonly.me — the cors origin callback
    # throws "Not allowed by CORS" and returns 500, so the frontend cannot load the user and
    # every /v2 page errors. The same allowlist feeds the socket.io cors. Caught by the Tier-1
    # staging smoke 2026-10-23 (all /v2 renders failed on CORS until this landed).
    frontendUrl: "https://staging.commonly.me"
    # Same defect, the API side: the chart default backendUrl is prod's https://api.commonly.me.
    # hostedMcpIntakeService builds the CIMD client_id and redirect_uris from PUBLIC_API_URL ||
    # BACKEND_URL, so without this staging's hosted-MCP client metadata advertised PROD's callback,
    # and accepting a staging consent would have sent a staging authorization code to prod.
    # Caught on the staging Atlassian walk 2026-10-23.
    backendUrl: "https://api-staging.commonly.me"
  # Staging backend runs on the SPOT pool at a fraction of prod's requests, so it fits
  # the nodes we already have (spot-pool sits at single-digit % CPU) without growing a
  # pool. Prod backend stays on dev-pool because it holds session state a spot
  # reclamation must never interrupt (values-dev); staging is the reckless, resettable
  # lane, so a reclamation just restarts it. The empty default nodeSelector/tolerations
  # in values.yaml left it stuck on the full, untainted default-pool ("Insufficient cpu
  # / untolerated taints"); this fixes that.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  nodeSelector:
    workload-tier: spot
  tolerations:
    - effect: NoSchedule
      key: workload-tier
      operator: Equal
      value: spot

# Staging frontend also on the spot pool, right-sized. It scheduled fine in the first
# attempt (small request), but consolidating it onto spot keeps the contended, untainted
# default-pool clear for cluster system pods.
frontend:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    workload-tier: spot
  tolerations:
    - effect: NoSchedule
      key: workload-tier
      operator: Equal
      value: spot

# No ops-runner in staging — operators exec into prod's ops-runner. Also keeps
# staging's render free of a backend-image pod it doesn't need.
opsRunner:
  enabled: false
# In-cluster MongoDB for staging — staging must NEVER hold an Atlas credential.
# The prod Mongo user is atlasAdmin (cluster-wide admin, including prod data), and
# staging auto-deploys every merge and is the deliberately reckless lane, so a shared
# Atlas credential is out of the question (incident 2026-10-22, AX-85 context). A
# single-replica in-cluster mongod on the spot pool, small PVC, seeded fresh and
# resettable, with a staging-only root password, replaces it. The root password is a
# fresh value in commonly-staging-mongo-password; the backend's
# commonly-staging-mongo-uri points at the in-cluster `mongodb` Service. Postgres
# still uses the Aiven commonly_staging database + a db-scoped (non-admin) role.
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7"
  persistence:
    enabled: true
    storageClass: standard-rwo
    size: 5Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  nodeSelector:
    workload-tier: spot
  tolerations:
    - effect: NoSchedule
      key: workload-tier
      operator: Equal
      value: spot

# Staging-only connector key ring (commonly-staging-connector-secret-keys / -active-key in SM,
# fresh keys, never prod's). Without it every hosted-MCP OAuth callback on staging threw.
connectorSecrets:
  enabled: true
