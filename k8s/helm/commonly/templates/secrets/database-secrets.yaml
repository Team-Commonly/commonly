{{- $keyPrefix := .Values.externalSecrets.keyPrefix | default "commonly-dev-" -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: {{ include "commonly.namespace" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
  data:
  - secretKey: mongo-uri
    remoteRef:
      key: {{ $keyPrefix }}mongo-uri
  - secretKey: mongo-password
    remoteRef:
      key: {{ $keyPrefix }}mongo-password
  - secretKey: postgres-password
    remoteRef:
      key: {{ $keyPrefix }}postgres-password
  {{- /* A per-component Postgres role's password, synced only once a deployed role names it. */}}
  {{- $roleKeys := dict }}
  {{- range $key := list .Values.backend.env.pgAppPasswordKey (ternary .Values.litellm.pgPasswordKey "" (eq (toString .Values.litellm.enabled) "true")) }}
  {{- if and $key (ne $key "postgres-password") }}{{ $_ := set $roleKeys $key true }}{{ end }}
  {{- end }}
  {{- range $key, $_ := $roleKeys }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $keyPrefix }}{{ $key }}
  {{- end }}
{{- end }}
