{{- $keyPrefix := .Values.externalSecrets.keyPrefix | default "commonly-dev-" -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-keys
  namespace: {{ include "commonly.namespace" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: api-keys
    creationPolicy: Owner
  data:
  # JWT and Authentication
  - secretKey: jwt-secret
    remoteRef:
      key: {{ $keyPrefix }}jwt-secret

  # AI Services
  - secretKey: gemini-api-key
    remoteRef:
      key: {{ $keyPrefix }}gemini-api-key
  - secretKey: openrouter-api-key
    remoteRef:
      key: {{ $keyPrefix }}openrouter-api-key
  - secretKey: openrouter-api-key-2
    remoteRef:
      key: {{ $keyPrefix }}openrouter-api-key-2
  - secretKey: openai-api-key
    remoteRef:
      key: {{ $keyPrefix }}openai-api-key
  - secretKey: anthropic-api-key
    remoteRef:
      key: {{ $keyPrefix }}anthropic-api-key

  {{- if .Values.errorTracking.enabled }}
  # Error tracking. Keep the entire remoteRef gated: ESO rejects the whole
  # ExternalSecret when any referenced remote key is missing.
  - secretKey: sentry-dsn
    remoteRef:
      key: {{ $keyPrefix }}sentry-dsn
  {{- end }}

  {{- if .Values.hostedSandbox.enabled }}
  # The run-code sandbox for native turns (E2B, TASK-266). Same gating rule as
  # error tracking: the remote key must exist with a version before this flips.
  - secretKey: e2b-api-key
    remoteRef:
      key: {{ $keyPrefix }}e2b-api-key
  {{- end }}

  {{- if .Values.webSearch.enabled }}
  # Web search for native turns (TASK-267a). Same gating rule as error
  # tracking: the remote key must exist with a version before this flips.
  - secretKey: search-api-key
    remoteRef:
      key: {{ $keyPrefix }}search-api-key
  {{- end }}

  {{- if .Values.billing.enabled }}
  # Billing (Stripe). Same gating rule as error tracking above: ESO rejects the
  # entire ExternalSecret when any referenced remote key is missing, so all
  # three must exist WITH a version in Secret Manager before this flag flips.
  # The price id is not secret, but it lives here so swapping test -> live is a
  # `gcloud secrets versions add`, not a chart edit and redeploy.
  - secretKey: stripe-secret-key
    remoteRef:
      key: {{ $keyPrefix }}stripe-secret-key
  - secretKey: stripe-webhook-secret
    remoteRef:
      key: {{ $keyPrefix }}stripe-webhook-secret
  - secretKey: stripe-price-id
    remoteRef:
      key: {{ $keyPrefix }}stripe-price-id
  {{- end }}

  # Cloudflare Workers AI — the model route the guide agent runs on.
  # Ungated on purpose, unlike the Stripe block below: both remote keys are
  # populated (verified with a live inference call before this landed), so
  # there is no missing-key risk to ESO. If either is ever deleted from Secret
  # Manager this whole ExternalSecret stops syncing — see the note above.
  - secretKey: cloudflare-workers-ai-token
    remoteRef:
      key: commonly-cloudflare-workers-ai-token
  - secretKey: cloudflare-account-id
    remoteRef:
      key: commonly-cloudflare-account-id

  # DeepSeek — the guide agent's model. Direct API, not via Cloudflare:
  # Workers AI carries no v4, only an r1 distill at 17x the output price.
  - secretKey: deepseek-api-key
    remoteRef:
      key: commonly-deepseek-api-key

  {{- if .Values.discord.enabled }}

  # Discord Integration
  - secretKey: discord-bot-token
    remoteRef:
      key: {{ $keyPrefix }}discord-bot-token
  - secretKey: discord-client-id
    remoteRef:
      key: {{ $keyPrefix }}discord-client-id
  - secretKey: discord-client-secret
    remoteRef:
      key: {{ $keyPrefix }}discord-client-secret
  - secretKey: discord-guild-id
    remoteRef:
      key: {{ $keyPrefix }}discord-guild-id
  # Discord webhook verification (B2). Create this remote key in Secret
  # Manager before deploying the fail-closed ingress; ESO rejects api-keys
  # when a referenced remote key is missing.
  - secretKey: discord-public-key
    remoteRef:
      key: {{ $keyPrefix }}discord-public-key
  {{- end }}

  # OAuth Providers
  - secretKey: google-client-id
    remoteRef:
      key: {{ $keyPrefix }}google-client-id
  - secretKey: google-client-secret
    remoteRef:
      key: {{ $keyPrefix }}google-client-secret
  - secretKey: github-client-id
    remoteRef:
      key: {{ $keyPrefix }}github-client-id
  - secretKey: github-client-secret
    remoteRef:
      key: {{ $keyPrefix }}github-client-secret
  - secretKey: x-oauth-client-id
    remoteRef:
      key: {{ $keyPrefix }}x-oauth-client-id
  - secretKey: x-oauth-client-secret
    remoteRef:
      key: {{ $keyPrefix }}x-oauth-client-secret

  # Codex OAuth Tokens (account 1)
  - secretKey: openai-codex-access-token
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-access-token
  - secretKey: openai-codex-refresh-token
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-refresh-token
  - secretKey: openai-codex-id-token
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-id-token
  - secretKey: openai-codex-expires-at
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-expires-at
  - secretKey: openai-codex-account-id
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-account-id
  # Codex OAuth Tokens (account 2)
  - secretKey: openai-codex-access-token-2
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-access-token-2
  - secretKey: openai-codex-refresh-token-2
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-refresh-token-2
  - secretKey: openai-codex-expires-at-2
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-expires-at-2
  - secretKey: openai-codex-access-token-3
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-access-token-3
  - secretKey: openai-codex-refresh-token-3
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-refresh-token-3
  - secretKey: openai-codex-expires-at-3
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-expires-at-3
  - secretKey: openai-codex-id-token-3
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-id-token-3
  - secretKey: openai-codex-account-id-3
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-account-id-3
  - secretKey: openai-codex-client-id
    remoteRef:
      key: {{ $keyPrefix }}openai-codex-client-id

  # Agent Runtime Tokens
  - secretKey: commonly-bot-runtime-token
    remoteRef:
      key: {{ $keyPrefix }}commonly-bot-runtime-token

  {{- if .Values.slack.oauth.enabled }}
  # Slack installable OAuth. These five must be created in Secret Manager
  # before enabling: a missing remoteRef prevents ESO from syncing api-keys.
  - secretKey: slack-client-id
    remoteRef:
      key: {{ $keyPrefix }}slack-client-id
  - secretKey: slack-client-secret
    remoteRef:
      key: {{ $keyPrefix }}slack-client-secret
  - secretKey: slack-signing-secret
    remoteRef:
      key: {{ $keyPrefix }}slack-signing-secret
  {{- end }}
  {{- if or .Values.slack.oauth.enabled .Values.connectorSecrets.enabled }}
  # Connector secret key ring (keyId:base64,...). Every hosted-MCP and Slack connection is
  # encrypted with it, so it can't stay tied to Slack OAuth: staging (Slack off) had no ring and
  # every hosted-MCP callback threw. Both remote keys must exist before enabling.
  - secretKey: connector-secret-keys
    remoteRef:
      key: {{ $keyPrefix }}connector-secret-keys
  - secretKey: connector-secret-active-key
    remoteRef:
      key: {{ $keyPrefix }}connector-secret-active-key
  {{- end }}
  {{- if .Values.hostedMcp.googleCalendar.enabled }}
  # Google Calendar hosted-MCP client (pre-registered). Both remote keys must
  # exist with a version before enabling: a missing remoteRef prevents ESO from
  # syncing api-keys.
  - secretKey: google-calendar-client-id
    remoteRef:
      key: {{ $keyPrefix }}google-calendar-client-id
  - secretKey: google-calendar-client-secret
    remoteRef:
      key: {{ $keyPrefix }}google-calendar-client-secret
  {{- end }}
  - secretKey: groupme-bot-id
    remoteRef:
      key: {{ $keyPrefix }}groupme-bot-id
  - secretKey: telegram-bot-token
    remoteRef:
      key: {{ $keyPrefix }}telegram-bot-token
  # Webhook secret_token (#1422 fail-closed verification): must match the
  # value registered with Telegram via setWebhook, or every delivery 401s.
  - secretKey: telegram-secret-token
    remoteRef:
      key: {{ $keyPrefix }}telegram-secret-token
  - secretKey: brave-api-key
    remoteRef:
      key: {{ $keyPrefix }}brave-api-key
  - secretKey: brave-api-key-2
    remoteRef:
      key: {{ $keyPrefix }}brave-api-key-2


# GitHub App credentials for the room-grant broker (TASK-033). Create all three
# remote keys in Secret Manager BEFORE merging: ESO rejects the whole api-keys
# ExternalSecret when any referenced remote key is missing, and every key in
# this bundle stops syncing.
  - secretKey: GITHUB_APP_ID
    remoteRef:
      key: {{ $keyPrefix }}github-app-id
  - secretKey: GITHUB_APP_PRIVATE_KEY
    remoteRef:
      key: {{ $keyPrefix }}github-app-private-key
  - secretKey: GITHUB_APP_INSTALLATION_ID_COMMONLY
    remoteRef:
      key: {{ $keyPrefix }}github-app-installation-id

  {{- if .Values.githubGig.fromSecret }}
  - secretKey: GITHUB_GIG_WEBHOOK_SECRET
    remoteRef:
      key: {{ $keyPrefix }}github-gig-webhook-secret
  {{- end }}

  {{- if .Values.email.enabled }}

  # Email (SMTP2GO)
  - secretKey: SMTP2GO_API_KEY
    remoteRef:
      key: {{ $keyPrefix }}SMTP2GO_API_KEY
  - secretKey: SMTP2GO_FROM_EMAIL
    remoteRef:
      key: {{ $keyPrefix }}SMTP2GO_FROM_EMAIL
  - secretKey: SMTP2GO_FROM_NAME
    remoteRef:
      key: {{ $keyPrefix }}SMTP2GO_FROM_NAME
  - secretKey: SMTP2GO_BASE_URL
    remoteRef:
      key: {{ $keyPrefix }}SMTP2GO_BASE_URL
  - secretKey: ONBOARDING_ALERT_EMAIL
    remoteRef:
      key: {{ $keyPrefix }}ONBOARDING_ALERT_EMAIL
  {{- end }}
  {{- if .Values.internalAccounts.fromSecret }}
  # Behind a flag: a remoteRef to a key the store doesn't have fails the whole
  # api-keys sync, so create the key first and only then turn this on.
  - secretKey: INTERNAL_ACCOUNTS
    remoteRef:
      key: {{ $keyPrefix }}INTERNAL_ACCOUNTS
  {{- end }}

  # LiteLLM Configuration
  - secretKey: litellm-master-key
    remoteRef:
      key: {{ $keyPrefix }}litellm-master-key

  # Git identity — used by init container to write /state/.gitconfig
  - secretKey: git-user-name
    remoteRef:
      key: commonly-git-user-name
  - secretKey: git-user-email
    remoteRef:
      key: commonly-git-user-email

  # Session and Security
  - secretKey: session-secret
    remoteRef:
      key: {{ $keyPrefix }}session-secret
{{- end }}
