{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-keys
  namespace: {{ include "commonly.namespace" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: api-keys
    creationPolicy: Owner
  data:
  # JWT and Authentication
  - secretKey: jwt-secret
    remoteRef:
      key: commonly-dev-jwt-secret

  # AI Services
  - secretKey: gemini-api-key
    remoteRef:
      key: commonly-dev-gemini-api-key
  - secretKey: openrouter-api-key
    remoteRef:
      key: commonly-dev-openrouter-api-key
  - secretKey: openrouter-api-key-2
    remoteRef:
      key: commonly-dev-openrouter-api-key-2
  - secretKey: openai-api-key
    remoteRef:
      key: commonly-dev-openai-api-key
  - secretKey: anthropic-api-key
    remoteRef:
      key: commonly-dev-anthropic-api-key

  {{- if .Values.errorTracking.enabled }}
  # Error tracking. Keep the entire remoteRef gated: ESO rejects the whole
  # ExternalSecret when any referenced remote key is missing.
  - secretKey: sentry-dsn
    remoteRef:
      key: commonly-dev-sentry-dsn
  {{- end }}

  {{- if .Values.billing.enabled }}
  # Billing (Stripe). Same gating rule as error tracking above: ESO rejects the
  # entire ExternalSecret when any referenced remote key is missing, so all
  # three must exist WITH a version in Secret Manager before this flag flips.
  # The price id is not secret, but it lives here so swapping test -> live is a
  # `gcloud secrets versions add`, not a chart edit and redeploy.
  - secretKey: stripe-secret-key
    remoteRef:
      key: commonly-dev-stripe-secret-key
  - secretKey: stripe-webhook-secret
    remoteRef:
      key: commonly-dev-stripe-webhook-secret
  - secretKey: stripe-price-id
    remoteRef:
      key: commonly-dev-stripe-price-id
  {{- end }}

  # Cloudflare Workers AI — the model route the guide agent runs on.
  # Ungated on purpose, unlike the Stripe block below: both remote keys are
  # populated (verified with a live inference call before this landed), so
  # there is no missing-key risk to ESO. If either is ever deleted from Secret
  # Manager this whole ExternalSecret stops syncing — see the note above.
  - secretKey: cloudflare-workers-ai-token
    remoteRef:
      key: commonly-cloudflare-workers-ai-token
  - secretKey: cloudflare-account-id
    remoteRef:
      key: commonly-cloudflare-account-id

  # DeepSeek — the guide agent's model. Direct API, not via Cloudflare:
  # Workers AI carries no v4, only an r1 distill at 17x the output price.
  - secretKey: deepseek-api-key
    remoteRef:
      key: commonly-deepseek-api-key

  # Discord Integration
  - secretKey: discord-bot-token
    remoteRef:
      key: commonly-dev-discord-bot-token
  - secretKey: discord-client-id
    remoteRef:
      key: commonly-dev-discord-client-id
  - secretKey: discord-client-secret
    remoteRef:
      key: commonly-dev-discord-client-secret
  - secretKey: discord-guild-id
    remoteRef:
      key: commonly-dev-discord-guild-id

  # OAuth Providers
  - secretKey: google-client-id
    remoteRef:
      key: commonly-dev-google-client-id
  - secretKey: google-client-secret
    remoteRef:
      key: commonly-dev-google-client-secret
  - secretKey: github-client-id
    remoteRef:
      key: commonly-dev-github-client-id
  - secretKey: github-client-secret
    remoteRef:
      key: commonly-dev-github-client-secret
  - secretKey: x-oauth-client-id
    remoteRef:
      key: commonly-dev-x-oauth-client-id
  - secretKey: x-oauth-client-secret
    remoteRef:
      key: commonly-dev-x-oauth-client-secret

  # Codex OAuth Tokens (account 1)
  - secretKey: openai-codex-access-token
    remoteRef:
      key: commonly-dev-openai-codex-access-token
  - secretKey: openai-codex-refresh-token
    remoteRef:
      key: commonly-dev-openai-codex-refresh-token
  - secretKey: openai-codex-id-token
    remoteRef:
      key: commonly-dev-openai-codex-id-token
  - secretKey: openai-codex-expires-at
    remoteRef:
      key: commonly-dev-openai-codex-expires-at
  - secretKey: openai-codex-account-id
    remoteRef:
      key: commonly-dev-openai-codex-account-id
  # Codex OAuth Tokens (account 2)
  - secretKey: openai-codex-access-token-2
    remoteRef:
      key: commonly-dev-openai-codex-access-token-2
  - secretKey: openai-codex-refresh-token-2
    remoteRef:
      key: commonly-dev-openai-codex-refresh-token-2
  - secretKey: openai-codex-expires-at-2
    remoteRef:
      key: commonly-dev-openai-codex-expires-at-2
  - secretKey: openai-codex-access-token-3
    remoteRef:
      key: commonly-dev-openai-codex-access-token-3
  - secretKey: openai-codex-refresh-token-3
    remoteRef:
      key: commonly-dev-openai-codex-refresh-token-3
  - secretKey: openai-codex-expires-at-3
    remoteRef:
      key: commonly-dev-openai-codex-expires-at-3
  - secretKey: openai-codex-id-token-3
    remoteRef:
      key: commonly-dev-openai-codex-id-token-3
  - secretKey: openai-codex-account-id-3
    remoteRef:
      key: commonly-dev-openai-codex-account-id-3
  - secretKey: openai-codex-client-id
    remoteRef:
      key: commonly-dev-openai-codex-client-id

  # Agent Runtime Tokens
  - secretKey: clawdbot-gateway-token
    remoteRef:
      key: commonly-dev-clawdbot-gateway-token
  - secretKey: commonly-bot-runtime-token
    remoteRef:
      key: commonly-dev-commonly-bot-runtime-token

  # Other Integrations
  - secretKey: slack-bot-token
    remoteRef:
      key: commonly-dev-slack-bot-token
  {{- if .Values.slack.oauth.enabled }}
  # Slack installable OAuth. These five must be created in Secret Manager
  # before enabling: a missing remoteRef prevents ESO from syncing api-keys.
  - secretKey: slack-client-id
    remoteRef:
      key: commonly-dev-slack-client-id
  - secretKey: slack-client-secret
    remoteRef:
      key: commonly-dev-slack-client-secret
  - secretKey: slack-signing-secret
    remoteRef:
      key: commonly-dev-slack-signing-secret
  - secretKey: connector-secret-keys
    remoteRef:
      key: commonly-dev-connector-secret-keys
  - secretKey: connector-secret-active-key
    remoteRef:
      key: commonly-dev-connector-secret-active-key
  {{- end }}
  - secretKey: groupme-bot-id
    remoteRef:
      key: commonly-dev-groupme-bot-id
  - secretKey: telegram-bot-token
    remoteRef:
      key: commonly-dev-telegram-bot-token
  # Webhook secret_token (#1422 fail-closed verification): must match the
  # value registered with Telegram via setWebhook, or every delivery 401s.
  - secretKey: telegram-secret-token
    remoteRef:
      key: commonly-dev-telegram-secret-token
  - secretKey: brave-api-key
    remoteRef:
      key: commonly-dev-brave-api-key
  - secretKey: brave-api-key-2
    remoteRef:
      key: commonly-dev-brave-api-key-2

  # GitHub — PAT for agent git operations (upgrade to GitHub App later)
  - secretKey: GITHUB_PAT
    remoteRef:
      key: commonly-github-pat

  # Email (SMTP2GO)
  - secretKey: SMTP2GO_API_KEY
    remoteRef:
      key: commonly-dev-SMTP2GO_API_KEY
  - secretKey: SMTP2GO_FROM_EMAIL
    remoteRef:
      key: commonly-dev-SMTP2GO_FROM_EMAIL
  - secretKey: SMTP2GO_FROM_NAME
    remoteRef:
      key: commonly-dev-SMTP2GO_FROM_NAME
  - secretKey: SMTP2GO_BASE_URL
    remoteRef:
      key: commonly-dev-SMTP2GO_BASE_URL
  - secretKey: ONBOARDING_ALERT_EMAIL
    remoteRef:
      key: commonly-dev-ONBOARDING_ALERT_EMAIL

  # LiteLLM Configuration
  - secretKey: litellm-master-key
    remoteRef:
      key: commonly-dev-litellm-master-key

  # Git identity — used by init container to write /state/.gitconfig
  - secretKey: git-user-name
    remoteRef:
      key: commonly-git-user-name
  - secretKey: git-user-email
    remoteRef:
      key: commonly-git-user-email

  # Session and Security
  - secretKey: session-secret
    remoteRef:
      key: commonly-dev-session-secret
{{- end }}
