{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: commonly-ingress
  namespace: {{ include "commonly.namespace" . }}
  labels:
    {{- include "commonly.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.ingress.hosts.frontend.host }}
    - {{ .Values.ingress.hosts.backend.host }}
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.hosts.frontend.host }}
    http:
      paths:
      - path: {{ .Values.ingress.hosts.frontend.path }}
        pathType: {{ .Values.ingress.hosts.frontend.pathType }}
        backend:
          service:
            name: frontend
            port:
              number: {{ .Values.frontend.service.port }}
  {{- range .Values.ingress.hosts.frontend.aliases }}
  - host: {{ . }}
    http:
      paths:
      - path: {{ $.Values.ingress.hosts.frontend.path }}
        pathType: {{ $.Values.ingress.hosts.frontend.pathType }}
        backend:
          service:
            name: frontend
            port:
              number: {{ $.Values.frontend.service.port }}
  {{- end }}
  - host: {{ .Values.ingress.hosts.backend.host }}
    http:
      paths:
      - path: {{ .Values.ingress.hosts.backend.path }}
        pathType: {{ .Values.ingress.hosts.backend.pathType }}
        backend:
          service:
            name: backend
            port:
              number: {{ .Values.backend.service.port }}
  {{- range .Values.ingress.hosts.backend.aliases }}
  - host: {{ . }}
    http:
      paths:
      - path: {{ $.Values.ingress.hosts.backend.path }}
        pathType: {{ $.Values.ingress.hosts.backend.pathType }}
        backend:
          service:
            name: backend
            port:
              number: {{ $.Values.backend.service.port }}
  {{- end }}
  {{- if and .Values.litellm.enabled .Values.ingress.hosts.litellm.host }}
  - host: {{ .Values.ingress.hosts.litellm.host }}
    http:
      paths:
      {{- /* `paths` wins over a legacy single `path` so an older values file cannot re-open `/`. */}}
      {{- range (.Values.ingress.hosts.litellm.paths | default (list .Values.ingress.hosts.litellm.path)) }}
      - path: {{ . }}
        pathType: {{ $.Values.ingress.hosts.litellm.pathType }}
        backend:
          service:
            name: litellm
            port:
              number: {{ $.Values.litellm.port }}
      {{- end }}
  {{- end }}
{{- end }}
{{- /*
  The app's own host also serves the API (/api, /socket.io), so the shell calls it same-origin and the
  browser sends no CORS preflight per new path. It is a second Ingress, merged by ingress-nginx with the
  one above by host and longest prefix, only so it can carry its own affinity cookie: sharing
  commonly-backend with the frontend's "/" on one host would make the two upstreams overwrite each
  other's cookie on every request that alternates between them. api.commonly.me is unchanged and stays
  the address for agents, the CLI, webhooks and every OAuth redirect URI.
*/}}
{{- if and .Values.ingress.enabled .Values.ingress.hosts.frontend.backendPaths }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: commonly-ingress-app-api
  namespace: {{ include "commonly.namespace" . }}
  labels:
    {{- include "commonly.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (omit .Values.ingress.annotations "nginx.ingress.kubernetes.io/session-cookie-name" "nginx.ingress.kubernetes.io/session-cookie-path") | nindent 4 }}
    nginx.ingress.kubernetes.io/session-cookie-name: {{ .Values.ingress.hosts.frontend.backendCookieName | quote }}
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.ingress.hosts.frontend.host }}
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.hosts.frontend.host }}
    http:
      paths:
      {{- range .Values.ingress.hosts.frontend.backendPaths }}
      - path: {{ . }}
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: {{ $.Values.backend.service.port }}
      {{- end }}
{{- end }}
