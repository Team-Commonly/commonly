{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ include "commonly.namespace" . }}
  labels:
    {{- include "commonly.redis.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "commonly.redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "commonly.redis.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
        {{- if .Values.redis.auth.enabled }}
        # requirepass via a generated conf, not --requirepass, so the password
        # never appears in the process args (ps). REDISCLI_AUTH lets the
        # redis-cli liveness/readiness probes authenticate without args too.
        command:
        - sh
        - -c
        - |
          umask 077
          printf 'requirepass %s\n' "$REDIS_PASSWORD" > /tmp/redis.conf
          # Hand off to the image entrypoint so it drops root -> the redis user
          # (gosu); chown the conf so that user can read it. Overriding command
          # alone would otherwise leave redis running as root.
          chown redis:redis /tmp/redis.conf
          exec docker-entrypoint.sh redis-server /tmp/redis.conf
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: redis-password
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: redis-password
        {{- end }}
        ports:
        - containerPort: {{ .Values.redis.service.port }}
          name: redis
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      {{- if and .Values.redis.nodeSelector (gt (len .Values.redis.nodeSelector) 0) }}
      nodeSelector:
        {{- toYaml .Values.redis.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if and .Values.redis.tolerations (gt (len .Values.redis.tolerations) 0) }}
      tolerations:
        {{- toYaml .Values.redis.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
