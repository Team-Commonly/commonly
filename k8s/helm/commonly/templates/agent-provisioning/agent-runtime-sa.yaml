{{- /*
The account for pods that run agent turns (once the backend's provisioned
OpenClaw gateways, whose provisioner was removed with the driver, ADR-021). The
chart grants it no Role and it mounts no
token. Always rendered, whatever the RBAC switches: the backend and ops-runner
are always told its name (AGENT_RUNTIME_SERVICE_ACCOUNT), and an account that
holds nothing costs nothing. Checked by
scripts/verify-service-account-tokens-chart.js.
*/ -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.agentProvisioning.runtimeServiceAccount | default "agent-runtime" }}
  namespace: {{ include "commonly.namespace" . }}
  labels:
    {{- include "commonly.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-runtime
automountServiceAccountToken: false
