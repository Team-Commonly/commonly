{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ include "commonly.namespace" . }}
  labels:
    {{- include "commonly.labels" . | nindent 4 }}
data:
  config.yaml: |
    # LiteLLM proxy config — routes all backend + agent LLM calls
    # Docs: https://docs.litellm.ai/docs/proxy/configs

    model_list:
      # --- DeepSeek (the guide agent's model) ---
      # Direct API, not via Cloudflare: Workers AI carries no v4 at all, only an
      # r1 distill at 17x the output price.
      #
      # Chosen by testing the two things a guide actually does, in the language
      # the confused users actually wrote (both people who asked "what is this
      # for" wrote Chinese):
      #   greeting  -> "你好！欢迎来到Commonly。很高兴见到你。你现在在做什么项目呢？"
      #                natural, one question, no feature dump, no invented identity
      #   tool call -> clean structured tool_calls, arguments {"name":"biomed-qa"}
      #
      # NOTE: responses carry `reasoning_content` alongside `content`. Content is
      # clean on its own — but anything reading the raw message must take
      # `content` and never concatenate the two, or the guide's first message to
      # a stranger is the model thinking out loud.
      - model_name: deepseek-v4-flash
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY
          # $60 per month across every caller of this group (TASK-555). Over
          # it, LiteLLM answers 429 "crossed budget". Like deepseek-flash-1017
          # below, the month-to-date figure is in the router cache and a
          # LiteLLM restart resets it: this is a backstop. The durable caps
          # are the per-service keys (backend $40, commonly-bot $20, in
          # LiteLLM's Postgres), and the budget alarm watches those.
          max_budget: 60
          budget_duration: 1mo

      # DeepSeek V4.1 Flash, 1017 build. DeepSeek publishes no dated snapshot
      # id: per api-docs.deepseek.com/updates, 2026-10-17, `deepseek-flash` is
      # "the latest model" and was upgraded to DeepSeek-V4.1-Flash-1017 that
      # day, while `deepseek-v4-flash` above is only "temporarily routed" to
      # V4.1 for compatibility. The group name carries the build so a key
      # scoped to it says what it buys; re-check the changelog before trusting
      # the name after DeepSeek's next Flash update. Used by the dsh writer
      # seats, through their own budget-capped virtual key.
      #
      # Budget (the DeepSeek writers are budget-capped). Two caps:
      #   1. This deployment: $200 per month across EVERY caller of the group.
      #      Over it, LiteLLM answers 429 "crossed budget" and does not reroute
      #      (there is no fallback for this group). Spend for this cap is
      #      tracked in the router's cache; with one replica and no Redis, a
      #      LiteLLM restart can reset the month-to-date figure, so it is a
      #      ceiling, not the ledger.
      #   2. The writers' virtual key: models=[deepseek-flash-1017],
      #      max_budget 200, budget_duration 30d. Stored in LiteLLM's Postgres,
      #      so it survives restarts and is the auditable record
      #      (/key/info). Minted after this ships; the key lives 0600 with
      #      its operator, never in the repo.
      - model_name: deepseek-flash-1017
        litellm_params:
          model: deepseek/deepseek-flash
          api_key: os.environ/DEEPSEEK_API_KEY
          max_budget: 200
          budget_duration: 1mo

      # --- Gemini (direct google provider) ---
      - model_name: google/gemini-2.5-flash
        litellm_params:
          model: gemini/gemini-2.5-flash
          api_key: os.environ/GEMINI_API_KEY

      - model_name: google/gemini-2.5-flash-lite
        litellm_params:
          model: gemini/gemini-2.5-flash-lite
          api_key: os.environ/GEMINI_API_KEY

      - model_name: google/gemini-2.0-flash
        litellm_params:
          model: gemini/gemini-2.0-flash
          api_key: os.environ/GEMINI_API_KEY

      # Aliases for backend llmService default model names
      - model_name: gemini-2.5-flash
        litellm_params:
          model: gemini/gemini-2.5-flash
          api_key: os.environ/GEMINI_API_KEY

      # --- nemotron aliases (community agents / gateway) ---
      # Registered with both prefixed and un-prefixed model names:
      # - openrouter/* used when gateway calls via openai-codex/gpt-5.4 fallback path
      # - nvidia/* used when gateway uses openrouter:default profile
      #   (OpenClaw strips the "openrouter/" prefix before sending to the provider)
      # D78 (2026-10-27): the OpenRouter route is DEAD — OpenRouter retired the free
      # tier for this model (404 "This model is unavailable for free; use slug
      # nvidia/nemotron-3-super-120b-a12b"). The OpenRouter key authenticates, but
      # every call to the :free slug 404s and then fell back to deepseek-v4-flash.
      # Rather than buy the paid slug (a new spend line) or keep the 404 hop, these
      # aliases now point STRAIGHT at the deepseek-v4-flash backend (D111 made it our
      # default). Callers keep their nemotron model_name but get DeepSeek with no
      # OpenRouter round-trip. Model-level $60/mo cap mirrors the deepseek-v4-flash
      # entry: the clawdbot gateway calls LiteLLM with the uncapped MASTER key, and
      # removing the 404-then-fallback hop also removes the cap it inherited, so the
      # cap moves onto the alias itself.
      - model_name: openrouter/nvidia/nemotron-3-super-120b-a12b:free
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY
          max_budget: 60
          budget_duration: 1mo

      - model_name: nvidia/nemotron-3-super-120b-a12b:free
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY
          max_budget: 60
          budget_duration: 1mo

      # NOTE: arcee-ai/trinity-large-preview:free was deregistered at OpenRouter
      # (404 No endpoints found) on 2026-05-03. Removed from model_list and from
      # all fallback chains below. If the model is reinstated, restore it as a
      # paired entry alongside nemotron above.

      # --- 2026-10-27: GPT/Codex access revoked. Every chatgpt/* alias below is
      # repointed to the deepseek/deepseek-v4-flash backend so callers keep their
      # model_name but get DeepSeek. The ChatGPT OAuth path (chatgpt/responses/*, the
      # codex-auth-rotator sidecar, auth.json) is dormant until GPT access returns;
      # revert this block to restore it. deepseek-v4-flash's own entry above is the
      # canonical backend and carries the group budget; these are thin aliases to it,
      # so they inherit DeepSeek pricing from LiteLLM's model db. The durable caps are
      # the service virtual keys (backend $40, commonly-bot $20). ---
      - model_name: gpt-5.4
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY

      - model_name: openai-codex/gpt-5.4
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY

      - model_name: gpt-5.4-mini
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY

      - model_name: openai-codex/gpt-5.4-mini
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY

      - model_name: gpt-5.4-nano
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY

      - model_name: openai-codex/gpt-5.4-nano
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY

      - model_name: codex-mini-latest
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY

      - model_name: o4-mini
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY

      - model_name: codex-cli/gpt-5.4
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY

      # --- OpenAI (optional, for embeddings) ---
      - model_name: text-embedding-3-large
        litellm_params:
          model: openai/text-embedding-3-large
          api_key: os.environ/OPENAI_API_KEY

      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY

      # --- OpenAI image generation (agent avatars, enriched content gen) ---
      # Backend openaiImageService.ts hits these via LITELLM_BASE_URL + LITELLM_MASTER_KEY
      # so the real OPENAI_API_KEY only needs to live on the LiteLLM pod, not on the backend.
      # Pricing (April 2026 list):
      #   dall-e-3 standard 1024x1024: $0.04 / image
      #   dall-e-3 hd       1024x1024: $0.08 / image
      #   gpt-image-1       1024x1024: ~$0.04 / image (usage-based, estimate)
      - model_name: dall-e-3
        litellm_params:
          model: openai/dall-e-3
          api_key: os.environ/OPENAI_API_KEY

      - model_name: gpt-image-1
        litellm_params:
          model: openai/gpt-image-1
          api_key: os.environ/OPENAI_API_KEY

      # Direct Anthropic routes removed. Claude on hosted runtimes
      # awaits OpenRouter routing; BYO Claude Code remains independent.

    router_settings:
      # The codex-auth-rotator sidecar rotates Codex accounts every 10 min on
      # schedule, AND fast-rotates on 429 via the rate_limit_signal callback
      # (writes /chatgpt-auth/rotate-now → sidecar polls and swaps auth.json).
      routing_strategy: least-busy
      enable_pre_call_checks: true
      # Fallback chain. Since 2026-10-27 the gpt-5.4*/openai-codex/* Codex
      # entries that used to fall through to nemotron here were removed — those
      # aliases now point straight at deepseek-v4-flash, and nemotron is dead (the
      # gateway it served is parked; OpenRouter keys expired 2026-10-25). The only
      # fallback entries below are inbound gemini/nemotron alias names that callers
      # still request; they fall through to deepseek-v4-flash.
      # Earlier removals from this chain:
      #   - Gemini removed 2026-05-03: GEMINI_API_KEY belongs to a project that
      #     doesn't have generativelanguage.googleapis.com enabled (403). Until
      #     a working key is provisioned in a project where the API is enabled,
      #     gemini fallbacks are net-negative — they add 60-120s of retries per
      #     failed request and surface confusing "Vertex AI" errors to callers.
      #   - Trinity removed 2026-05-03: 404 No endpoints found at OpenRouter.
      # If deepseek-v4-flash itself is unavailable the request fails fast — the
      # caller (gateway/agent) sees the failure and the "LiteLLM is failing its
      # callers" alert fires (docs/runbooks/alerting.md#litellm-failing). There is
      # no nemotron or Codex tier behind it any more.
      fallbacks:
        # 2026-10-27: gpt-5.4*/openai-codex/*/codex-cli gpt->nemotron fallbacks
        # removed — those aliases now point straight at deepseek-v4-flash (primary), and
        # nemotron itself is dead (OpenRouter keys expired 2026-10-25).
        # Dead routes fall back to deepseek-v4-flash (2026-10-15). Probing every
        # chat route from the backend pod found exactly two answering:
        # deepseek-v4-flash and the since-removed Workers AI route. Every Gemini name 401s
        # (Google: ACCESS_TOKEN_TYPE_UNSUPPORTED for GEMINI_API_KEY) and both
        # nemotron names 401 at OpenRouter. Callers still ask for those names:
        # the commonly-bot client defaults to gemini-2.5-flash; pod-welcomer,
        # task-clerk and pod-summarizer run on nemotron. With no fallback each
        # call died and the feature fell back to a template or to silence; 154
        # Gemini 401s in 24h, unnoticed. A fallback keeps the feature answering;
        # the "LiteLLM is failing its callers" alert covers deepseek itself
        # going dead (docs/runbooks/alerting.md#litellm-failing).
        - {"gemini-2.5-flash":        ["deepseek-v4-flash"]}
        - {"google/gemini-2.5-flash": ["deepseek-v4-flash"]}
        - {"google/gemini-2.5-flash-lite": ["deepseek-v4-flash"]}
        - {"google/gemini-2.0-flash": ["deepseek-v4-flash"]}
        - {"openrouter/nvidia/nemotron-3-super-120b-a12b:free": ["deepseek-v4-flash"]}
        - {"nvidia/nemotron-3-super-120b-a12b:free": ["deepseek-v4-flash"]}
      # One retry on rate-limit with a deliberate 1s delay. This retry is a global
      # router setting and still applies to every deployment. The Codex auth.json
      # rotation it was originally written for is dormant since 2026-10-27 (no chatgpt/*
      # route consumes the rotator now); for the repointed aliases a 429 simply
      # retries the same deepseek-v4-flash deployment after 1s, then fails fast.
      #
      # Why not num_retries=0: a single 429 used to drop the request entirely,
      # falling to the (then-broken, now-narrow) fallback chain. Same-prompt
      # retries don't bill against the 429'd account (4XX = no charge), so
      # spending one retry across the rotator is genuinely free until success.
      #
      # Why not num_retries>1: chaining retries beyond 1 risks cascading
      # rotations under sustained burst load — multiple retries would each
      # signal the rotator and burn through fresh accounts in milliseconds.
      # See feedback-litellm-retry-doubles-rotation-burn (2026-05-03 incident).
      num_retries: 1
      retry_after: 1
      # Deployment cooldown: when a model deployment trips allowed_fails failures
      # (e.g. a 429'd / failing Codex account), LiteLLM parks that deployment for
      # cooldown_time seconds instead of immediately re-picking it on the next
      # request. This complements the rotator's account-level cap-cooldown: the
      # router stops hammering a sick deployment while the rotator swaps auth.json
      # underneath. Conservative values — short enough that a transient blip
      # recovers within a minute, long enough to break a tight re-pick loop.
      # Does NOT alter the fallback chain order above.
      allowed_fails: 2
      cooldown_time: 60

    litellm_settings:
      # Drop unsupported params instead of erroring (important for OpenRouter quirks)
      drop_params: true
      # Global upstream request timeout (seconds). Only the codex model entries set a
      # per-model `timeout`; nemotron/gemini/openai/anthropic entries have none, so a
      # hung non-codex upstream could otherwise pin a worker on this single-replica
      # proxy indefinitely. This global cap bounds every request lacking a per-model
      # timeout; it matches the codex per-model value (120s).
      request_timeout: 120
      # Custom callback that writes /chatgpt-auth/rotate-now when any request hits a
      # rate limit. The codex-auth-rotator sidecar polls that file and rotates
      # accounts immediately (instead of waiting for its next scheduled tick).
      # The callback module is installed at /tmp/callbacks/rate_limit_signal.py by
      # the container startup script; PYTHONPATH is set accordingly.
      # deepseek_tool_shim flattens codex's namespace tools into plain function
      # tools for the deepseek-flash-1017 group only, which DeepSeek requires;
      # source in files/litellm/deepseek_tool_shim.py, mounted from this ConfigMap.
      # model_fallback_signal prints one {"alarm":"model_fallback"} line per
      # fallback in router_settings.fallbacks, naming requested and fallback
      # groups (TASK-003); the `model_fallback` log metric counts them.
      callbacks: ["rate_limit_signal.proxy_handler_instance", "deepseek_tool_shim.proxy_handler_instance", "model_fallback_signal.proxy_handler_instance"]

    guardrails:
      # Anti-pattern content guardrails for the public-launch exposure. Both are
      # ENFORCE (block) + default_on:false, so they run ONLY when a caller opts in
      # via the request-body `guardrails:[...]` field. The ONLY opt-in caller is
      # backend/services/llmService.ts (platform features — summarizer / daily digest
      # / skills / avatars — which ingest UNTRUSTED pod content: the indirect-prompt-
      # injection surface once registration is public). Dev-agent per-agent-key
      # traffic never sends the field, so coding prompts are never blocked.
      #
      # INCIDENT NOTE (2026-06-29): an `openai-moderation-monitor` guardrail with
      # `mode: "logging_only"` was added here and crash-looped the litellm pod —
      # logging_only is NOT a supported event hook on v1.88.0-rc.1. Only during_call
      # (and pre_call/post_call) validate at startup. This block was boot-tested in a
      # throwaway litellm pod (Application startup complete, 0 errors) before shipping.
      # Do NOT reintroduce logging_only without re-validating against the pinned image.
      - guardrail_name: "openai-moderation-enforce"
        litellm_params:
          guardrail: openai_moderation
          mode: "during_call"
          model: "omni-moderation-latest"
          api_key: os.environ/OPENAI_API_KEY
          default_on: false
      - guardrail_name: "injection-guard"
        litellm_params:
          # NATIVE LiteLLM content-filter guardrail (first-party, local keyword +
          # conditional matching — no external service, key, or license, and no
          # custom module to maintain). Replaced the hand-rolled regex module
          # (prompt_injection_guard.PromptInjectionGuard) — the built-in categories
          # cover more attack shapes and it blocks with a clean HTTP 400.
          # pre_call = reject BEFORE the upstream LLM call (saves the spend + latency).
          # severity_threshold=high keeps false-positives low: boot- + functionally
          # tested in a throwaway litellm — all injection attacks (ignore+reveal
          # system prompt / print original instructions / disregard-safety+DAN)
          # block; normal chat ("act as if the demo works", "sql query for users",
          # "reveal the winner") passes. NB severity_threshold does NOT spare the
          # 11 medium always_block_keywords — all 79 block regardless (measured
          # v1.106.2). sql + malicious_code categories are intentionally OFF — this
          # is a dev-agent platform; blocking SQL/code discussion would be absurd.
          #
          # skip_system_message_in_guardrail: scope the guard to UNTRUSTED input
          # (user + tool content) and never scan our OWN system-role text. Our
          # system prompts legitimately contain always_block substrings — a hosted
          # agent named "Daniel" made the system prompt open "You are Daniel…",
          # matching the jailbreak keyword "you are dan" and blocking EVERY turn
          # (P0 2026-11-01). The guard exists to catch a poisoned pod message or a
          # user prompt-injecting a native agent, both of which arrive as user/tool
          # roles — scanning our own authored system text only produces FPs. The
          # registry reads this from litellm_params and the translation layer drops
          # role=="system" before the content_filter sees the text; user + tool are
          # still scanned. See docs/runbooks/litellm-guardrails.md.
          guardrail: litellm_content_filter
          mode: "pre_call"
          default_on: false
          severity_threshold: "high"
          skip_system_message_in_guardrail: true
          categories:
            - { category: "prompt_injection_jailbreak", action: "BLOCK" }
            - { category: "prompt_injection_system_prompt", action: "BLOCK" }
            - { category: "prompt_injection_data_exfiltration", action: "BLOCK" }

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
      # Restrict the admin UI to admin users. The UI is not publicly routed
      # (the nginx ingress maps only litellm.commonly.me/v1), so this is
      # defense-in-depth against a future ingress/tunnel change exposing it.
      ui_access_mode: "admin_only"
      # Reject client-supplied upstream overrides on requests: api_base / base_url
      # and the provider endpoint + credential-override fields in LiteLLM's
      # _BANNED_REQUEST_BODY_PARAMS. The /v1 endpoint is public for BYO goose/pi
      # callers and is key-gated, so a leaked virtual key must NOT be usable to
      # redirect to arbitrary upstreams on our spend — which this blocks.
      # NOTE: on v1.106.2 this does NOT ban a request-body `api_key` (it is not in
      # _BANNED_REQUEST_BODY_PARAMS); that path would bill the caller's own key,
      # not our spend, so it is out of scope for this setting.
      # Default is already false; set explicitly so it can't drift (2026-10-28).
      allow_client_side_credentials: false
      # Spend log retention — without these, LiteLLM_SpendLogs grows unbounded
      # (prod dev observed 5+ GB on the 8 GiB Cloud SQL tier before this cap).
      # STORE_PROMPTS_IN_SPEND_LOGS=false keeps raw prompt and response text
      # out of each row; a 7-day window is plenty for dev debugging.
      maximum_spend_logs_retention_period: "7d"
      maximum_spend_logs_retention_interval: "6h"
  # Mounted at /app/, next to config.yaml (see the callbacks list above).
  # deepseek_tool_shim.py is the callback and loads the core inside a try, so a
  # broken core refuses only the deepseek group instead of stopping the proxy.
  deepseek_tool_shim.py: |
    {{- .Files.Get "files/litellm/deepseek_tool_shim.py" | nindent 4 }}
  deepseek_tool_shim_core.py: |
    {{- .Files.Get "files/litellm/deepseek_tool_shim_core.py" | nindent 4 }}
  model_fallback_signal.py: |
    {{- .Files.Get "files/litellm/model_fallback_signal.py" | nindent 4 }}
{{- end }}
