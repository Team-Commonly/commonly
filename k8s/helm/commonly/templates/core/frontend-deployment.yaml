{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ include "commonly.namespace" . }}
  labels:
    {{- include "commonly.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  {{- with .Values.frontend.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "commonly.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "commonly.frontend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.frontend.service.port }}
          name: http
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        # Keep serving for 10 s after the pod is marked for deletion, as the backend does.
        # ingress-nginx removes a pod from its upstreams a moment after the deletion, and
        # nginx here exits at once on SIGTERM. A request sent in that gap goes to an
        # address that no longer answers and waits out proxy_connect_timeout (5 s) before
        # the retry. Measured 2026-10-19: one such 5 s hang in each of that day's two
        # rollouts.
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      {{- if and .Values.frontend.nodeSelector (gt (len .Values.frontend.nodeSelector) 0) }}
      nodeSelector:
        {{- toYaml .Values.frontend.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if and .Values.frontend.tolerations (gt (len .Values.frontend.tolerations) 0) }}
      tolerations:
        {{- toYaml .Values.frontend.tolerations | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
