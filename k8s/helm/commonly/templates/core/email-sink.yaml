{{- /*
The staging email sink (backend/services/stagingEmailSink.ts). With
email.sink.enabled the backend, its worker and ops-runner send mail here instead
of SMTP2GO (backend-deployment.yaml, ops-runner-deployment.yaml), so email
sign-up works on an instance with no real delivery and nothing leaves the
cluster. Mail is read back with GET /inbox?to=<address> and the bearer token in
the email-sink Secret; see docs/runbooks/staging-email-sink.md.
*/ -}}
{{- if .Values.email.sink.enabled }}
{{- if .Values.email.enabled }}
{{- fail "email.sink.enabled and email.enabled are exclusive: the sink replaces real delivery, it does not sit beside it" }}
{{- end }}
{{- if eq (.Values.backend.env.frontendUrl | default "" | trimSuffix "/") "https://commonly.me" }}
{{- fail "email.sink.enabled is refused where frontendUrl is https://commonly.me: real users' mail would never leave the cluster" }}
{{- end }}
{{- $ns := include "commonly.namespace" . -}}
{{- $sink := .Values.email.sink -}}
{{- /* Keep the read token across upgrades; mint one on first install. */ -}}
{{- $token := dig "data" "read-token" "" (lookup "v1" "Secret" $ns "email-sink") -}}
{{- if not $token }}{{ $token = randAlphaNum 40 | b64enc }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: email-sink
  namespace: {{ $ns }}
  labels:
    {{- include "commonly.labels" . | nindent 4 }}
    app: email-sink
type: Opaque
data:
  read-token: {{ $token }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-sink
  namespace: {{ $ns }}
  labels:
    {{- include "commonly.labels" . | nindent 4 }}
    app: email-sink
spec:
  # One replica: the inbox lives in this process's memory.
  replicas: 1
  selector:
    matchLabels:
      app: email-sink
  template:
    metadata:
      labels:
        {{- include "commonly.labels" . | nindent 8 }}
        app: email-sink
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sink
          # The backend image carries the compiled sink; no image of its own.
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          workingDir: /app
          command: ["node", "dist/services/stagingEmailSink.js"]
          env:
            - name: PORT
              value: {{ $sink.port | quote }}
            - name: EMAIL_SINK_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: email-sink
                  key: read-token
          ports:
            - name: http
              containerPort: {{ $sink.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $sink.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with $sink.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sink.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: email-sink
  namespace: {{ $ns }}
  labels:
    {{- include "commonly.labels" . | nindent 4 }}
    app: email-sink
spec:
  type: ClusterIP
  selector:
    app: email-sink
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
{{- end }}
