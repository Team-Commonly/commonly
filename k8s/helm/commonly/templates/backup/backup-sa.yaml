{{- if or (and .Values.backup.mongodb.enabled (eq (include "commonly.mongodb.engine" .) "mongodb")) .Values.backup.postgresql.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-sa
  namespace: {{ include "commonly.namespace" . }}
  labels:
    {{- include "commonly.labels" . | nindent 4 }}
    component: backup
  {{- with .Values.backup.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ tpl . $ | quote }}
  {{- end }}
{{- end }}
