{{- /*
One Steel browser per person (agentComputer.users): a profile disk, a
Deployment and a ClusterIP Service, all named steel-{userId} to match the
backend's AGENT_COMPUTER_STEEL_*_URL_TEMPLATE. Steel takes no credentials, so
it listens on loopback only and a token gate in the same pod is the Service's
only backend. The token is in the backend's env for its broker, and in
ops-runner's, which carries the backend's env for operator scripts. Agents
never get the address (agentComputerBroker.ts).
*/ -}}
{{- $users := include "commonly.agentComputer.users" . | fromJsonArray -}}
{{- if $users }}
{{- $ns := include "commonly.namespace" . -}}
{{- $steel := .Values.agentComputer.steel -}}
---
# The browser never calls the Kubernetes API. Its own account has no token and
# no role, and keeps it off any workload-identity binding on `default`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-computer-steel
  namespace: {{ $ns }}
  labels:
    {{- include "commonly.labels" $ | nindent 4 }}
    app: agent-computer-steel
automountServiceAccountToken: false
---
# Chrome's managed policy (files/agent-computer/chrome-policy.json), mounted
# over the image's own, which held only the file:// block kept here. Steel
# leaves its CDP and API ports open to any page on loopback, so the browser
# itself refuses: URLBlocklist stops navigations, redirect hops included, to
# loopback and metadata names, and LocalNetworkAccessBlockedForUrls stops any
# page or worker request, sockets included, to a loopback or private address
# after DNS. scripts/agent-computer-steel-probe.sh attacks both in CI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-computer-chrome-policy
  namespace: {{ $ns }}
  labels:
    {{- include "commonly.labels" $ | nindent 4 }}
    app: agent-computer-steel
data:
  00_policy.json: |
{{ .Files.Get "files/agent-computer/chrome-policy.json" | indent 4 }}
{{- range $id := $users }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: steel-{{ $id }}-profile
  namespace: {{ $ns }}
  labels:
    {{- include "commonly.labels" $ | nindent 4 }}
    app: agent-computer-steel
    commonly.me/computer-user: {{ $id | quote }}
  annotations:
    # The profile holds the person's signed-in session; a helm uninstall or a
    # dropped user id must not delete it.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $steel.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $steel.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steel-{{ $id }}
  namespace: {{ $ns }}
  labels:
    {{- include "commonly.labels" $ | nindent 4 }}
    app: agent-computer-steel
    commonly.me/computer-user: {{ $id | quote }}
spec:
  # No replicas field, on purpose. The waker owns scale (it wakes a stopped
  # browser), and with the field absent from every render helm's three-way
  # merge leaves a live session alone on upgrade. A new Deployment starts at 1.
  strategy:
    # The profile disk is ReadWriteOnce: the old pod must let go of it first.
    type: Recreate
  selector:
    matchLabels:
      app: agent-computer-steel
      commonly.me/computer-user: {{ $id | quote }}
  template:
    metadata:
      labels:
        {{- include "commonly.labels" $ | nindent 8 }}
        app: agent-computer-steel
        commonly.me/computer-user: {{ $id | quote }}
      annotations:
        # A policy change restarts the browser so it starts under the new
        # policy. The profile disk keeps the signed-in session.
        checksum/chrome-policy: {{ $.Files.Get "files/agent-computer/chrome-policy.json" | sha256sum }}
    spec:
      serviceAccountName: agent-computer-steel
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # The image's own user (node, 1000) owns the profile disk.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Chrome refuses a profile whose Singleton lock names another host, and
        # Steel clears only a lock its own hostname left. Every new pod has a
        # new hostname. Recreate plus the ReadWriteOnce disk mean the old pod is
        # gone, so its lock is stale by construction.
        - name: clear-profile-lock
          image: "{{ $steel.image.repository }}@{{ $steel.image.digest }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "rm -f /profile/SingletonLock /profile/SingletonSocket /profile/SingletonCookie"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: profile
              mountPath: /profile
      containers:
        - name: steel
          image: "{{ $steel.image.repository }}@{{ $steel.image.digest }}"
          imagePullPolicy: IfNotPresent
          # The broker reaches CDP through Steel's own WebSocket proxy on the
          # API port, the path the TASK-276 spike proved. The bundled nginx on
          # 9223 forwards the caller's Host header, and Chrome answers
          # /json/version only for an IP or localhost Host, so it stays off.
          args: ["--no-nginx"]
          env:
            # Steel binds its API, and Chrome its debugging port, to HOST. Both
            # take no credentials, so both stay on loopback; the gate below is
            # the pod's only listener.
            - name: HOST
              value: "127.0.0.1"
            - name: PORT
              value: "3001"
            # Steel launches its default browser at startup, before any session
            # is created, so the profile must be on the disk from that launch
            # on, not only for a persist:true session (same path).
            - name: CHROME_USER_DATA_DIR
              value: /app/api/user-data-dir
            # Steel drops Chrome's sandbox only when it runs as root. Under
            # 1000 Chrome would try its user-namespace sandbox, which
            # RuntimeDefault seccomp refuses, and fail to start. Chrome ran
            # unsandboxed as root before this; the container is the boundary
            # either way, now as non-root with no capabilities.
            - name: DISABLE_CHROME_SANDBOX
              value: "true"
          resources:
            {{- toYaml $steel.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: profile
              mountPath: /app/api/user-data-dir
            - name: dshm
              mountPath: /dev/shm
            - name: chrome-policy
              mountPath: /etc/chromium/policies/managed
              readOnly: true
            # Steel creates /files at start, and the image's root can't be
            # written by 1000.
            - name: steel-files
              mountPath: /files
        # The token gate (backend/services/agentComputerSteelGate.ts): every
        # request and WebSocket upgrade must carry the bearer token only the
        # backend's broker holds. Its /healthz reflects Steel's own health.
        - name: gate
          # Any change to the pod template restarts the browser (Recreate), and
          # every deploy moves backend.image.tag. Pin gate.imageTag to keep
          # deploys from restarting a live session; empty follows the backend.
          image: "{{ $.Values.backend.image.repository }}:{{ $steel.gate.imageTag | default $.Values.backend.image.tag }}"
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["node", "dist/services/agentComputerSteelGate.js"]
          env:
            - name: PORT
              value: "3000"
            - name: STEEL_UPSTREAM_PORT
              value: "3001"
            - name: STEEL_GATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-computer-steel
                  key: token
          ports:
            - name: api
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $steel.gate.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: profile
          persistentVolumeClaim:
            claimName: steel-{{ $id }}-profile
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $steel.shmSizeLimit }}
        - name: chrome-policy
          configMap:
            name: agent-computer-chrome-policy
        - name: steel-files
          emptyDir:
            sizeLimit: 1Gi
      {{- with $steel.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $steel.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: steel-{{ $id }}
  namespace: {{ $ns }}
  labels:
    {{- include "commonly.labels" $ | nindent 4 }}
    app: agent-computer-steel
    commonly.me/computer-user: {{ $id | quote }}
spec:
  type: ClusterIP
  selector:
    app: agent-computer-steel
    commonly.me/computer-user: {{ $id | quote }}
  ports:
    - name: api
      port: 3000
      targetPort: api
      protocol: TCP
{{- end }}
{{- if .Values.externalSecrets.enabled }}
{{- $keyPrefix := .Values.externalSecrets.keyPrefix | default "commonly-dev-" }}
---
# The gate's token, which the backend's broker also reads
# (AGENT_COMPUTER_STEEL_TOKEN), as does ops-runner, which carries the
# backend's env. Its own ExternalSecret, apart from the waker's,
# so either token can rotate alone and a missing key fails only this sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-computer-steel
  namespace: {{ $ns }}
  labels:
    {{- include "commonly.labels" . | nindent 4 }}
    app: agent-computer-steel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: agent-computer-steel
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ $keyPrefix }}agent-computer-steel-token
{{- end }}
{{- end }}
