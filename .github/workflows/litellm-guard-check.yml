name: LiteLLM Guard Check

# The injection-guard fails open: a category file LiteLLM can't load only logs
# a warning, and the proxy serves with a guard that no longer blocks. The
# litellm container checks this at boot but only raises an alarm, because on
# dev (one replica, Recreate) stopping there would take every model call down.
# This is the hard stop: it runs the same boot check, plus pass/block probes,
# against the LiteLLM version the chart pins, so a broken guard never merges.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    # Only changes that can move the guard's answer run it.
    paths:
      - 'k8s/helm/commonly/files/litellm/**'
      - 'k8s/helm/commonly/templates/configmaps/litellm-config.yaml'
      - 'k8s/helm/commonly/templates/agents/litellm-deployment.yaml'
      - 'k8s/helm/commonly/values.yaml'
      - 'k8s/helm/commonly/values-dev.yaml'
      - 'scripts/litellm-guard-check.py'
      - '.github/workflows/litellm-guard-check.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: azure/setup-helm@v4
      - name: Install the LiteLLM version the chart pins
        run: |
          python3 -m pip install --quiet pyyaml
          tag=$(python3 -c "import yaml; print(yaml.safe_load(open('k8s/helm/commonly/values.yaml'))['litellm']['image']['tag'])")
          version="${tag#v}"
          echo "litellm image tag $tag -> pip litellm[proxy]==$version"
          python3 -m pip install --quiet "litellm[proxy]==$version"
      - name: Run the injection-guard check
        run: python3 -I scripts/litellm-guard-check.py
