name: Package Version Guard

# A published package's version is the ONLY check available from outside this
# repo. When two different artifacts carry one version, that check silently
# passes while the artifact and the repo disagree — and nobody can tell.
#
# It has happened twice:
#   #979  @commonlyai/mcp   npm 0.3.0 and main 0.3.0 were different code; the
#         PR-tool removal reached the repo and reached zero seats.
#   #1017 @commonlyai/cli   npm 0.1.9 and main 0.1.9 were different code, with
#         SEVEN source commits since the bump — including #995, the quota
#         misclassification that had seats probing a dead provider every 5s.
#
# Until TASK-466 (2026-10-24) this guard made every PR that touched cli/src or
# commonly-mcp/src bump the version, and refused a version an older open PR had
# claimed. That kept the invariant, at a cost: every such PR edited the same
# line, so concurrent PRs conflicted on it (13 open PRs claimed 11 cli versions
# on 10-24, three of them 0.1.148; #2589 needed three bumps).
#
# Now npm-publish.yml assigns the version at publish time and tags the commit it
# built (cli-v<ver> / mcp-v<ver>). This guard checks that record after each
# publish, independently of the job that wrote it: the tagged commit, packed,
# must be file-for-file the tarball npm serves. That is the #979/#1017
# guarantee — one version, one commit — checked on the artifact itself.
#
# The PR-side half is now advisory only: a PR that still edits a version line
# gets a warning, because that edit is what made PRs conflict, not because it
# can break a release (the publish takes max(registry, repo) + 1 either way).

on:
  workflow_run:
    workflows: [ "Publish npm packages" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - 'cli/package.json'
      - 'commonly-mcp/package.json'
      - 'commonly-mcp/server.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'published' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-leaves-version-alone:
    name: PR leaves the version line alone
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn on a version edit
        shell: bash
        run: |
          set -euo pipefail
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          for f in cli/package.json commonly-mcp/package.json commonly-mcp/server.json; do
            if git diff "$BASE"...HEAD -- "$f" | grep -qE '^[+-][^+-].*"version":'; then
              echo "::warning file=$f::This PR edits the version in $f. Since TASK-466 the version is assigned when npm-publish runs; revert this line so the PR stops conflicting with every other cli/mcp PR."
            else
              echo "· $f: version untouched"
            fi
          done

  published-matches-tag:
    name: Published version = its tagged commit
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # untagged: the last version published before TASK-466, the only
          # one allowed on npm without a tag (npm-publish's next run tags it).
          - pkg: cli
            prefix: cli-v
            untagged: 0.1.155
          - pkg: commonly-mcp
            prefix: mcp-v
            untagged: 0.3.16
    steps:
      # workflow_run runs with the default branch's context, so this checks out
      # main (never a PR ref), and the only other commit it runs code from is a
      # release tag proven to be on main first. Read-only token throughout.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # the tagged commit must be reachable, and checked against main
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tagged commit packs to exactly what npm serves
        shell: bash
        env:
          PKG: ${{ matrix.pkg }}
          PREFIX: ${{ matrix.prefix }}
          UNTAGGED: ${{ matrix.untagged }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./$PKG/package.json').name")
          reg_v=$(npm view "$name" version)
          tag="$PREFIX$reg_v"

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # Only the last version published before TASK-466 may be untagged.
            # Any other missing tag is a publish whose tag push failed, even
            # the first one (no tags at all is not evidence of an old version).
            if [ "$reg_v" = "$UNTAGGED" ]; then
              echo "· $name $reg_v predates release tags (TASK-466); npm-publish's next run tags it"
              exit 0
            fi
            echo "::error::$name $reg_v is on npm but tag $tag does not exist. Releases after TASK-466 are tagged; find the npm-publish run that published $reg_v."
            exit 1
          fi

          sha=$(git rev-parse "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$tag points at $sha, which is not on main"; exit 1; }
          git checkout -q --detach "$sha"
          bash scripts/npm-artifact-diff.sh "$PKG" "$reg_v" \
            || { echo "::error::$name $reg_v does not match the commit its tag names ($tag → $sha)"; exit 1; }
          echo "✓ $name $reg_v = $tag = $sha"
