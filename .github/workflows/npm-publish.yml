name: Publish npm packages

# Companion to package-version-guard.yml. That guard makes "source moved but
# version didn't" go red on the PR; this workflow closes the other half of the
# loop: "version moved but nobody published". As of 2026-08-29 main carried
# cli 0.1.22 / mcp 0.3.5 while npm served 0.1.18 / 0.3.4 — four CLI releases
# that never left the repo, so every `commonly` install and every seat on this
# laptop ran code the repo had already replaced.
#
# Since TASK-466 (2026-10-24) PRs never touch a package's version line. Every
# cli/mcp PR used to bump it, so concurrent PRs conflicted on that one line and
# the guard refused duplicate claims (13 open PRs claimed 11 cli versions, three
# of them 0.1.148). The version is now assigned HERE, at publish time:
#
# Trigger: a push to main that touches a published package. For each package:
#   1. pack this tree and compare it with the registry's latest tarball,
#      ignoring package.json "version" (scripts/npm-artifact-diff.sh)
#        identical → nothing to do
#   2. otherwise version = next patch above max(registry, repo package.json),
#      stamped into the working copy only (npm version --no-git-tag-version;
#      commonly-mcp's server.json too), never committed
#   3. publish, read it back, push tag cli-v<ver> / mcp-v<ver> on the commit
#      that was built, then assert tag → this SHA and registry → this version.
# package-version-guard.yml re-checks each publish independently: the tag's
# commit, packed and stamped, must equal the tarball npm serves. One version,
# one commit (#979 / #1017).
#
# The repo's package.json version is therefore a floor, not the release. A
# `commonly --version` / the MCP handshake still report the stamped version,
# because both read the package.json that ships inside the tarball.
#
# Auth: npm trusted publishing (OIDC). No token is stored anywhere. Each package
# on npmjs.com names this repo and this workflow file as its trusted publisher,
# and the job's id-token is exchanged for a short-lived publish credential.
# That needs npm >= 11.5.1, which the job installs, and `id-token: write`.
# Provenance is attached automatically.
#
# Why: until 2026-10-01 this used an NPM_TOKEN granular token (set 2026-08-29).
# It stopped being accepted, and the cli 0.1.82 publish failed with
# `E404 Not Found - PUT .../@commonlyai%2fcli` (run 36872618263): a token that
# can expire is a release outage on a timer.
#
# This file is deliberately NOT in its own path filter: merging it must not
# fire a publish before the trusted publisher is configured on npmjs.com.
# The first release after the switch goes through workflow_dispatch.

on:
  push:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'commonly-mcp/**'
      - 'docs/agents/skills/commonly/SKILL.md'   # cli prepublishOnly copies it in
  workflow_dispatch:
    inputs:
      package:
        description: 'Package dir to publish (cli | commonly-mcp | all)'
        default: 'all'
        type: choice
        options: [ all, cli, commonly-mcp ]

permissions:
  contents: read

# Granted on the job, not here, so a job added to this file later starts
# read-only instead of inheriting tag-push rights.

concurrency:
  group: npm-publish
  cancel-in-progress: false   # never abort a publish mid-flight

jobs:
  publish:
    name: ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the cli-v<ver> / mcp-v<ver> release tag
      id-token: write   # npm trusted publishing (OIDC) + provenance
    strategy:
      fail-fast: false
      matrix:
        pkg: [ cli, commonly-mcp ]
    # No job-level `if` on matrix: jobs.<id>.if cannot see the matrix context
    # (only github/needs/vars/inputs), and a workflow that fails validation
    # never appears in the check set — it is absent, not red. The package
    # picker is applied in the compare step instead.
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    env:
      PKG: ${{ matrix.pkg }}
      PICK: ${{ github.event.inputs.package || 'all' }}
      TAG_PREFIX: ${{ matrix.pkg == 'cli' && 'cli-v' || 'mcp-v' }}
    steps:
      - uses: actions/checkout@v4

      # No `registry-url`: setup-node@v4 then writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` to the runner npmrc,
      # and npm reads a present-but-empty token as "auth configured", skips the
      # OIDC exchange and fails E404 (Vera, measured in setup-node's dist; fixed
      # only in v7). npmjs.org is npm's default registry anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decide whether this tree holds anything unpublished
        id: cmp
        shell: bash
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          repo_v=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"

          if [ "$PICK" != "all" ] && [ "$PICK" != "$PKG" ]; then
            echo "· $name: not selected (package=$PICK)"
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A dispatch can name any branch. Publishing or tagging from one
          # would release code main does not hold. This catches a mistaken
          # dispatch; it is not a security boundary, because a branch's own
          # copy of this file can drop it. The boundary is the trusted-publisher
          # binding plus who can dispatch; a protected main-only environment is
          # the planned hardening.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::$name: this workflow publishes only from main (got $GITHUB_REF)"
            exit 1
          fi

          # "Never published" (E404) is the first-release path and maps to
          # 0.0.0. Anything else — outage, auth, rate limit — must stop the
          # run: a registry we cannot read is not a registry at 0.0.0.
          if reg_v=$(npm view "$name" version 2>/tmp/npm-view.err); then
            :
          elif grep -q 'E404' /tmp/npm-view.err; then
            reg_v="0.0.0"
          else
            echo "::error::$name: npm view failed for a reason other than E404:"; cat /tmp/npm-view.err
            exit 1
          fi

          # Prerelease ordering is beyond `sort -V` (same limit the guard
          # documents), and "next patch" is undefined for one.
          case "$repo_v$reg_v" in *-*)
            echo "::error::$name: prerelease in $reg_v / $repo_v; this workflow does not order prereleases. Publish by hand."
            exit 1;;
          esac

          if [ "$reg_v" != "0.0.0" ]; then
            set +e; bash "$GITHUB_WORKSPACE/scripts/npm-artifact-diff.sh" . "$reg_v"; d=$?; set -e
            # The diff step ran prepublishOnly; put the tree back as checked out.
            git checkout -- . && git clean -fdq -- .
            case "$d" in
              # Already published: nothing for npm, but the MCP Registry step
              # still lists that version, so a failed listing can be retried.
              # The version's release tag must exist too: a run whose publish
              # landed and whose tag push failed is re-run into this branch.
              0) echo "version=$reg_v" >> "$GITHUB_OUTPUT"
                 set +e; git ls-remote --exit-code --tags origin "refs/tags/$TAG_PREFIX$reg_v" >/dev/null; t=$?; set -e
                 case "$t" in
                   0) echo "action=skip" >> "$GITHUB_OUTPUT" ;;
                   # This commit packs exactly what npm serves for $reg_v, which is
                   # the invariant the tag asserts, so it may carry the missing
                   # tag. That holds for a version published before TASK-466
                   # too, so the first run tags it and there is no bootstrap
                   # case where a missing tag is left missing.
                   2) echo "· $name: $reg_v is published but $TAG_PREFIX$reg_v is missing; tagging $GITHUB_SHA, which packs the same files"
                      echo "action=retag" >> "$GITHUB_OUTPUT" ;;
                   *) echo "::error::$name: could not read tag $TAG_PREFIX$reg_v (git ls-remote exit $t)"; exit 1 ;;
                 esac
                 exit 0 ;;
              1) ;;
              *) echo "::error::$name: could not compare with $reg_v; not publishing blind"; exit 1 ;;
            esac
          fi

          floor=$(printf '%s\n%s\n' "$reg_v" "$repo_v" | sort -V | tail -1)
          next=$(echo "$floor" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
          # --exit-code: 0 found, 2 no such ref. Anything else is a lookup that
          # failed, which proves nothing about the tag, so only 2 may publish.
          set +e; git ls-remote --exit-code --tags origin "refs/tags/$TAG_PREFIX$next" >/dev/null; t=$?; set -e
          case "$t" in
            2) ;;
            0) echo "::error::$name: tag $TAG_PREFIX$next already exists but npm serves $reg_v. A publish half-finished; reconcile by hand."
               exit 1 ;;
            *) echo "::error::$name: could not read tag $TAG_PREFIX$next (git ls-remote exit $t); not publishing blind"
               exit 1 ;;
          esac
          echo "✓ $name: registry $reg_v, repo floor $repo_v → publishing $next"
          echo "next=$next"        >> "$GITHUB_OUTPUT"
          echo "version=$next"     >> "$GITHUB_OUTPUT"
          echo "action=publish"    >> "$GITHUB_OUTPUT"

      # The version exists only in this job's working copy and so in the
      # tarball; nothing is committed. server.json goes with it, because the
      # MCP Registry step below lists the version server.json names and checks
      # it against package.json. It also runs when the tree is already
      # published (version = what npm serves), so a re-run after a failed
      # registry listing lists that version, not the repo's stale floor.
      - name: Stamp the version into the working copy
        if: steps.cmp.outputs.version != ''
        env:
          VERSION: ${{ steps.cmp.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if [ -f server.json ]; then
            node -e "const f='server.json',j=require('./'+f);j.version=process.env.VERSION;(j.packages||[]).forEach(p=>p.version=process.env.VERSION);require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          fi
          node -p "'stamped ' + require('./package.json').version"

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Use an npm that supports trusted publishing
        if: steps.cmp.outputs.action == 'publish'
        run: npm install -g npm@^11.5.1 && npm --version

      # Turns the opaque registry E404 into a named failure (Vera 76338).
      - name: Refuse to publish without a usable OIDC identity
        if: steps.cmp.outputs.action == 'publish'
        run: |
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo "::error::id-token: write is not in effect; trusted publishing cannot run"; exit 1; }
          for f in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" ./.npmrc; do
            [ -n "$f" ] && [ -f "$f" ] && grep -q '_authToken' "$f" && { echo "::error::$f carries _authToken; npm would skip the OIDC exchange and fail E404"; exit 1; }
          done
          true

      - name: Install
        if: steps.cmp.outputs.action == 'publish'
        run: npm ci --ignore-scripts

      - name: Publish
        if: steps.cmp.outputs.action == 'publish'
        # No NODE_AUTH_TOKEN: npm exchanges this job's OIDC id-token with the
        # registry, because the package names this workflow as trusted publisher.
        run: npm publish --provenance --access public

      # The poll, its budget (READBACK_TIMEOUT_SECONDS; the script prints the
      # value in force, which is the single place this number is stated) and the
      # failure diagnostics live in the script, not inline here — a workflow
      # body cannot be exercised by the suite, and this loop went red on two
      # good publishes (cli 0.1.65 run 35498255344, 0.1.66 run 35804128707)
      # before anyone could test it. TASK-100.
      #
      # $GITHUB_WORKSPACE, not a relative path: this job sets
      # working-directory to the package dir, and the script is at the repo
      # root. It is cwd-independent, so the workspace path is the only
      # unambiguous way to reach it.
      - name: Read it back from the registry
        if: steps.cmp.outputs.action == 'publish'
        shell: bash
        env:
          NAME: ${{ steps.cmp.outputs.name }}
          WANT: ${{ steps.cmp.outputs.next }}
        run: bash "$GITHUB_WORKSPACE/scripts/verify-npm-publish-readback.sh"

      # The tag is the record of which commit a version was built from. Pushed
      # only after npm serves the version, so a tag never names a release that
      # does not exist; a publish whose tag push failed is caught by the next
      # run (it refuses to reuse the version) and by package-version-guard.
      - name: Tag the commit that was built
        if: steps.cmp.outputs.action == 'publish' || steps.cmp.outputs.action == 'retag'
        env:
          TAG: ${{ env.TAG_PREFIX }}${{ steps.cmp.outputs.version }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Assert tag → this commit and registry → this version
        if: steps.cmp.outputs.action == 'publish' || steps.cmp.outputs.action == 'retag'
        env:
          NAME: ${{ steps.cmp.outputs.name }}
          NEXT: ${{ steps.cmp.outputs.version }}
          TAG: ${{ env.TAG_PREFIX }}${{ steps.cmp.outputs.version }}
        run: |
          set -euo pipefail
          tag_sha=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          [ "$tag_sha" = "$GITHUB_SHA" ] || { echo "::error::$TAG points at '$tag_sha', not the built commit $GITHUB_SHA"; exit 1; }
          got=$(npm view "$NAME@$NEXT" version)
          [ "$got" = "$NEXT" ] || { echo "::error::npm serves '$got' for $NAME@$NEXT"; exit 1; }
          echo "✓ $NAME $NEXT = $TAG = $GITHUB_SHA"

      # The MCP Registry lists commonly-mcp from its server.json, after npm
      # serves the version. Runs whether or not this push published (it is a
      # no-op when the version is already listed), so a registry failure can be
      # retried by re-running the job. Auth is this job's OIDC id-token.
      - name: List commonly-mcp on the MCP Registry
        if: matrix.pkg == 'commonly-mcp' && (env.PICK == 'all' || env.PICK == 'commonly-mcp')
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/publish-mcp-registry.sh"
