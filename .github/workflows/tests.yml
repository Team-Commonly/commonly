name: Tests

on:
  push:
    branches: [ v1.0.x ]
  # No branches filter on pull_request: stacked PRs (base = another feature
  # branch) previously got ZERO test runs — every number on them was
  # single-sourced to the author's local sweep, and the 2026-08-22 threading
  # train shipped two real failures that only surfaced once CI was dispatched
  # by hand. Merge-to-main guards (base-freshness, version-guard) stay scoped
  # to main; the test tiers run for every PR regardless of base.
  pull_request:
  # The merge queue on main runs the required check (Test & Coverage) on the
  # queue's own commit, which is main plus the PRs ahead of it. Without this
  # trigger a queued PR never gets that check and the queue stalls. The
  # concurrency group below already falls back to github.sha for this event,
  # so each queue commit gets its own group.
  merge_group:
  # Coverage is collected on this nightly schedule only — not on pull_request
  # or merge_group, where --coverage added wall time to every required-check
  # run for a report nobody reads on the PR. 08:00 UTC ~= 01:00 PT, off-peak.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The push fallback is github.sha, NOT github.ref. On a push event `github.ref`
# is the branch, so concurrent commits would cancel each other. This caused
# 18 of 39 Tests runs on main to be cancelled (2026-08-04 → 08-06).
#
# The loss is ordered by job depth, not random, which is what makes it worth
# fixing rather than tolerating:
#
#   Chart Lint        no needs,  ~8s      survived 12 of 14
#   old Test & Coverage   no needs,  ~5.5min  survived  3 of 14
#   Service Tests         formerly needs:test          survived 0 of 14
#
# Service Tests is the ADR-009 Tier 1 real-DB tier — the deepest job, and the
# only one that never once completed in a cancelled run. So the tier main was
# silently skipping is the tier hardest to reproduce anywhere else.
#
# Per-SHA grouping lets every commit finish; PR runs still supersede correctly
# because pull_request.number short-circuits before the fallback is read.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  paths:
    name: Select test paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      tools: ${{ steps.select.outputs.tools }}
      chart: ${{ steps.select.outputs.chart }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/ci/select_test_paths.py
      - run: python3 -m unittest discover -s scripts/ci -p 'test_select_test_paths.py'

  backend-tests:
    name: Backend tests (${{ matrix.shard }}/3)
    needs: paths
    if: needs.paths.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-jwt-secret
      SENDGRID_API_KEY: fake-api-key
      SENDGRID_FROM_EMAIL: test@example.com
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci --include=dev
      - name: Run backend tests with coverage
        run: cd backend && npx jest --coverage --forceExit --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: backend/coverage/

  backend-checks:
    name: Backend typecheck and lint
    needs: paths
    if: needs.paths.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci --include=dev
      - run: cd backend && npm run tsc:check
      - run: cd packages/types && ../../backend/node_modules/.bin/tsc --noEmit -p tsconfig.json
      - run: cd backend && npm run lint:ts

  frontend-tests:
    name: Frontend tests
    needs: paths
    if: needs.paths.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # Frontend typecheck follows shared imports into backend TypeScript.
      - run: cd backend && npm ci --include=dev
      - run: cd frontend && npm install --legacy-peer-deps
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npx jest --coverage --watchAll=false --forceExit
      - run: cd frontend && node --test scripts/generate-seo-pages.test.mjs scripts/nginx-routing.test.mjs

  tool-tests:
    name: CLI, MCP and hosted runtime tests
    needs: paths
    if: needs.paths.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            commonly-mcp/package-lock.json
            cli/package-lock.json
            workers/agent-runtime/package-lock.json
      - run: npm ci --include=dev
      # CLI tests load backend TypeScript through ts-node.
      - run: cd backend && npm ci --include=dev
      - run: cd commonly-mcp && npm ci --include=dev
      - run: cd cli && npm ci --include=dev
      - run: cd workers/agent-runtime && npm ci --include=dev
      - run: npm run verify:moltbot-tools
      - run: npm run verify:litellm-patch-runner
      - run: cd commonly-mcp && npm test
      - run: cd cli && npm run lint && npm test
      - run: cd workers/agent-runtime && npm run typecheck && npm test

  test-gate:
    name: Test & Coverage
    if: always()
    needs: [paths, backend-tests, backend-checks, frontend-tests, tool-tests, service-test, chart-lint]
    runs-on: ubuntu-latest
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Verify every selected check passed
        run: |
          echo "$NEEDS_JSON" | jq -e '
            . as $jobs |
            $jobs.paths.result == "success" and
            $jobs["service-test"].result == "success" and
            ($jobs["chart-lint"].result == "success" or
              ($jobs.paths.outputs.chart == "false" and $jobs["chart-lint"].result == "skipped")) and
            (if $jobs.paths.outputs.backend == "true" then
              $jobs["backend-tests"].result == "success" and $jobs["backend-checks"].result == "success"
             else
              $jobs["backend-tests"].result == "skipped" and $jobs["backend-checks"].result == "skipped"
             end) and
            (if $jobs.paths.outputs.frontend == "true" then
              $jobs["frontend-tests"].result == "success"
             else $jobs["frontend-tests"].result == "skipped" end) and
            (if $jobs.paths.outputs.tools == "true" then
              $jobs["tool-tests"].result == "success"
             else $jobs["tool-tests"].result == "skipped" end)
          '

  legacy-test:
    # Retire only after the new gate passes a real merge_group run.
    name: Legacy test and coverage
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: test-jwt-secret
      SENDGRID_API_KEY: fake-api-key
      SENDGRID_FROM_EMAIL: test@example.com
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          npm ci --include=dev
          cd backend
          npm ci --include=dev
          cd ../frontend
          npm install --legacy-peer-deps
          cd ../commonly-mcp
          npm ci --include=dev
          cd ../cli
          npm ci --include=dev
          cd ../workers/agent-runtime
          npm ci --include=dev
          cd ../..

      - name: Verify moltbot tool contract
        run: npm run verify:moltbot-tools

      # Executes the litellm boot block's patch runner against a two-tree fixture,
      # so the 79-hour SEV class (patcher and proxy resolving `import litellm` to
      # different copies) fails here instead of in a crash-looping pod. Needs a
      # python3 on PATH — ubuntu-latest ships one; if that ever stops being true
      # the guard says so by name rather than passing quietly.
      - name: Verify litellm patch runner
        run: npm run verify:litellm-patch-runner

      - name: Backend TypeScript check
        run: |
          cd backend
          npm run tsc:check

      - name: Frontend TypeScript check
        run: |
          cd frontend
          npm run typecheck

      # packages/types has zero dependencies and zero external imports, so it
      # needs no install of its own — it typechecks with the compiler the
      # backend step already installed. Gated now because it is green now;
      # that is the only moment a gate is free.
      #
      # packages/commonly-apps is deliberately NOT gated here. It defines the
      # same tsc:check script and is equally uninvoked, but it needs @types/node
      # and is not npm ci'd by this job, so adding it means adding an install.
      # Its actual state is unknown, not assumed green. Separate change.
      - name: Shared types TypeScript check
        run: |
          cd packages/types
          ../../backend/node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Run backend tests (coverage on the nightly schedule only)
        run: |
          cd backend
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npx jest --coverage --forceExit
          else
            npx jest --forceExit
          fi

      - name: Run frontend tests (coverage on the nightly schedule only)
        run: |
          cd frontend
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npx jest --coverage --watchAll=false --forceExit
          else
            npx jest --watchAll=false --forceExit
          fi
          node --test scripts/generate-seo-pages.test.mjs scripts/nginx-routing.test.mjs

      # The node:test files under external/commonly-agent-services were run by
      # no job, so the agent services' own helpers were ungated, including the
      # one that decides what text reaches a pod summary surface (#2406).
      # Listed by file, like the frontend scripts step above.
      - name: Run agent service tests
        run: |
          node --test \
            external/commonly-agent-services/shared/delivery-nonce.test.js \
            external/commonly-agent-services/shared/summary-text.test.js

      - name: Run commonly-mcp tests
        run: |
          cd commonly-mcp
          npm test

      # Backend `.ts` lint. TASK-024 measured this reaching 0 of 286 files:
      # `npm run lint` was scoped `--ext .js`, every backend `lint-staged` glob
      # had gone stale to zero as its files were converted, and no CI job ran
      # backend lint at all.
      #
      # Deliberately `lint:ts`, NOT `npm run lint`. The backend `.js` corpus is
      # 2,279 errors across 282 files (277 of them under `__tests__`) and has
      # been red on main for some time — wiring the existing script in would
      # fail on the first run. That half is in the burn-down task, not here.
      - name: Backend TypeScript lint
        run: |
          cd backend
          npm run lint:ts

      - name: Run CLI lint
        run: |
          cd cli
          npm run lint

      - name: Run CLI tests
        run: |
          cd cli
          npm test

      - name: Run hosted-runtime tests (ADR-023 W2)
        run: |
          cd workers/agent-runtime
          npm run typecheck
          npm test

      - name: Upload coverage report
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/

  service-test:
    name: Service Tests (Tier 1 — real DBs)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commonly-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: test-jwt-secret
      SENDGRID_API_KEY: fake-api-key
      SENDGRID_FROM_EMAIL: test@example.com
      FRONTEND_URL: http://localhost:3000
      INTEGRATION_TEST: "true"
      MONGO_URI: mongodb://localhost:27017/commonly-test
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DATABASE: commonly-test
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_SSL_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # This job has no needs, so it starts with the other suites. Classify here
      # independently; a docs-only PR still starts the job but runs no tests.
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/ci/select_test_paths.py

      - name: Set up Node.js
        if: steps.select.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install backend dependencies
        if: steps.select.outputs.backend == 'true'
        run: cd backend && npm ci --include=dev

      - name: Run service tests (Tier 1)
        if: steps.select.outputs.backend == 'true'
        run: |
          cd backend
          npx jest --testPathPattern="__tests__/service" --forceExit --runInBand

  chart-lint:
    name: Chart Lint (Tier 1.5)
    needs: paths
    if: needs.paths.outputs.chart == 'true'
    runs-on: ubuntu-latest

    env:
      # Pin CRD schemas to a known commit to avoid drift.
      # Update manually by running: gh api /repos/datreeio/CRDs-catalog/commits/main --jq .sha
      CRDS_CATALOG_SHA: 15e9b72701ce617b0ac15da611a7fb2e54b980dd
      KUBECONFORM_VERSION: v0.7.0
      YQ_VERSION: v4.44.3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o kc.tgz
          sudo tar -xzf kc.tgz -C /usr/local/bin/ kubeconform
          kubeconform -v

      - name: Install yq
        run: |
          curl -sSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq
          yq --version

      - name: Render dev chart
        run: |
          helm template commonly-dev k8s/helm/commonly \
            -f k8s/helm/commonly/values.yaml \
            -f k8s/helm/commonly/values-dev.yaml \
            > /tmp/dev-rendered.yaml

      - name: Lint rendered dev chart
        run: |
          kubeconform --strict --summary -output text \
            --schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRDS_CATALOG_SHA}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            --schema-location default \
            /tmp/dev-rendered.yaml

      - name: Validate alerting config (offline)
        # k8s/monitoring/ is applied by hand with scripts/monitoring/apply-alerting.py
        # (docs/runbooks/alerting.md). --check makes no API call: it asserts every
        # policy links a runbook heading, every metric/uptime reference resolves,
        # and no project or account identifier is committed.
        run: python3 scripts/monitoring/apply-alerting.py --check

      - name: Assert reliability rollout and scheduling invariants
        run: |
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "backend") | .spec.strategy.type' /tmp/dev-rendered.yaml)" = "RollingUpdate"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "backend") | .spec.strategy.rollingUpdate.maxUnavailable' /tmp/dev-rendered.yaml)" = "0"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "backend") | .spec.strategy.rollingUpdate.maxSurge' /tmp/dev-rendered.yaml)" = "1"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "backend") | .spec.template.spec.volumes | map(select(has("persistentVolumeClaim"))) | length' /tmp/dev-rendered.yaml)" = "0"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "redis") | .spec.template.spec.nodeSelector.pool' /tmp/dev-rendered.yaml)" = "dev"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "redis") | .spec.template.spec.tolerations | map(select(.key == "workload-tier")) | length' /tmp/dev-rendered.yaml)" = "0"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "redis") | .spec.template.spec.tolerations | map(select(.key == "pool" and .value == "dev" and .effect == "NoSchedule")) | length' /tmp/dev-rendered.yaml)" = "1"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "backend") | .spec.minReadySeconds' /tmp/dev-rendered.yaml)" = "10"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "backend") | .spec.template.spec.terminationGracePeriodSeconds' /tmp/dev-rendered.yaml)" = "30"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "backend") | .spec.template.spec.containers[] | select(.name == "backend") | .readinessProbe.httpGet.path' /tmp/dev-rendered.yaml)" = "/api/health/ready"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "backend") | .spec.template.spec.containers[] | select(.name == "backend") | .lifecycle.preStop.exec.command[2]' /tmp/dev-rendered.yaml)" = "sleep 10"
          # Two frontend replicas never share a node, so a spot reclaim leaves one serving; with the spot
          # pool capped at 2 nodes, a rollout must replace in place (maxSurge 0) or it deadlocks (2026-10-19).
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "frontend") | .spec.replicas' /tmp/dev-rendered.yaml)" = "2"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "frontend") | .spec.strategy.rollingUpdate.maxSurge' /tmp/dev-rendered.yaml)" = "0"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "frontend") | .spec.strategy.rollingUpdate.maxUnavailable' /tmp/dev-rendered.yaml)" = "1"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "frontend") | .spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey' /tmp/dev-rendered.yaml)" = "kubernetes.io/hostname"
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "frontend") | .spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchLabels.app' /tmp/dev-rendered.yaml)" = "frontend"
          # A frontend pod keeps serving until ingress-nginx has dropped it, or a request waits out the 5 s connect timeout.
          test "$(yq 'select(.kind == "Deployment" and .metadata.name == "frontend") | .spec.template.spec.containers[] | select(.name == "frontend") | .lifecycle.preStop.exec.command[2]' /tmp/dev-rendered.yaml)" = "sleep 10"
          # LiteLLM is public for its /v1 API only; `/` exposed the master-key admin login (2026-10-07).
          test "$(yq 'select(.kind == "Ingress") | .spec.rules[] | select(.host == "litellm.commonly.me") | .http.paths | map(.path) | join(",")' /tmp/dev-rendered.yaml)" = "/v1"
          # LiteLLM reads its config only at boot, so its pod must roll when the config changes.
          test -n "$(yq -N 'select(.kind == "Deployment" and .metadata.name == "litellm") | .spec.template.metadata.annotations."checksum/config" // ""' /tmp/dev-rendered.yaml)"
          # Nightly DB backups (2026-10-14): both jobs render, run on spot-pool (the only
          # pool with the GKE metadata server, so the only one where backup-sa's
          # Workload Identity works), and dump the same Postgres the backend uses.
          test "$(yq -N 'select(.kind == "CronJob" and .metadata.labels.component == "backup") | .metadata.name' /tmp/dev-rendered.yaml | sort | paste -sd, -)" = "mongodb-backup,postgres-backup"
          test "$(yq -N 'select(.kind == "CronJob" and .metadata.labels.component == "backup") | .spec.jobTemplate.spec.template.spec.nodeSelector."workload-tier"' /tmp/dev-rendered.yaml | sort -u)" = "spot"
          for pair in PG_HOST:PG_HOST PG_PORT:PGPORT PG_USER:PG_USER PG_DATABASE:PG_DATABASE; do
            backend=$(B="${pair%%:*}" yq -N 'select(.kind == "Deployment" and .metadata.name == "backend") | .spec.template.spec.containers[] | select(.name == "backend") | .env[] | select(.name == strenv(B)) | .value' /tmp/dev-rendered.yaml)
            dump=$(D="${pair##*:}" yq -N 'select(.kind == "CronJob" and .metadata.name == "postgres-backup") | .spec.jobTemplate.spec.template.spec.initContainers[0].env[] | select(.name == strenv(D)) | .value' /tmp/dev-rendered.yaml)
            test -n "$backend" && test "$backend" = "$dump"
          done
          # Stranger journey (2026-10-15): renders, and never retries (a retry would sign
          # up a second account and could hide a flaky step behind a later pass).
          test "$(yq -N 'select(.kind == "CronJob" and .metadata.name == "stranger-journey") | .spec.jobTemplate.spec.backoffLimit' /tmp/dev-rendered.yaml)" = "0"

      - name: Render Slack OAuth secret wiring
        run: |
          helm template commonly-slack k8s/helm/commonly \
            -f k8s/helm/commonly/values.yaml \
            -f k8s/helm/commonly/values-dev.yaml \
            --set slack.oauth.enabled=true \
            > /tmp/slack-rendered.yaml
          for key in slack-client-id slack-client-secret slack-signing-secret connector-secret-keys connector-secret-active-key; do
            test "$(yq 'select(.kind == "ExternalSecret" and .metadata.name == "api-keys") | .spec.data[].secretKey' /tmp/slack-rendered.yaml | grep -Fx "$key")" = "$key"
          done
          for name in SLACK_CLIENT_ID SLACK_CLIENT_SECRET SLACK_SIGNING_SECRET CONNECTOR_SECRET_KEYS CONNECTOR_SECRET_ACTIVE_KEY; do
            test "$(yq 'select(.kind == "Deployment" and .metadata.name == "backend") | .spec.template.spec.containers[] | select(.name == "backend") | .env[].name' /tmp/slack-rendered.yaml | grep -Fx "$name")" = "$name"
          done

      - name: Render and lint prod chart (if values-prod.yaml exists)
        run: |
          if [ -f k8s/helm/commonly/values-prod.yaml ]; then
            helm template commonly-prod k8s/helm/commonly \
              -f k8s/helm/commonly/values.yaml \
              -f k8s/helm/commonly/values-prod.yaml \
            | kubeconform --strict --summary -output text \
                --schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRDS_CATALOG_SHA}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
                --schema-location default
          else
            echo "values-prod.yaml not present yet (lands in ADR-009 Phase 5); skipping prod lint."
          fi
