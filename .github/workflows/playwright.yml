name: Playwright Tests

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'e2e/**'
      - 'playwright.config.*'
  # No branches filter: stacked PRs must get E2E too (see tests.yml note).
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'e2e/**'
      - 'playwright.config.*'
  workflow_dispatch:

permissions:
  contents: read

# Push fallback is github.sha, not github.ref — see the long note in tests.yml.
# This workflow is push-triggered too, so it had the same collapse: 13 of 40
# runs on main cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's image ships Chromium and its system deps, so the job never
    # runs apt. `playwright install --with-deps` did, and an Ubuntu mirror
    # outage on 2026-11-11 failed every E2E run for hours (F431). The tag must
    # match the @playwright/test version in package-lock.json; the first step
    # below fails fast if they drift. Bump the tag and digest together.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --ipc=host

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commonly
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: e2e-test-jwt-secret
      FRONTEND_URL: http://localhost:5173
      # Inside a job container, services are reached by name, not localhost.
      MONGO_URI: mongodb://mongo:27017/commonly-e2e
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: commonly
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_SSL_ENABLED: "false"
      NODE_ENV: test
      # SMTP2GO_* intentionally omitted — backend auto-verifies users without it
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install root dependencies
        run: npm ci --include=dev

      - name: Install backend dependencies
        run: cd backend && npm ci --include=dev

      - name: Install frontend dependencies
        run: cd frontend && OPENUI_TELEMETRY_DISABLED=1 npm install --legacy-peer-deps

      # The browsers come from the container image. If @playwright/test moves
      # off the image's version, the tests would fail later with a missing
      # browser, so stop here with the fix instead.
      - name: Check Playwright matches the container image
        run: |
          want=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          if [ "$want" != "1.57.0" ]; then
            echo "::error::@playwright/test is $want but the job container is v1.57.0; bump the container tag and digest in playwright.yml"
            exit 1
          fi

      - name: Start backend
        run: |
          cd backend
          npm run build
          # In a container job each step is its own `docker exec`, and a plain
          # `&` child doesn't reliably outlive it: the backend passed wait-on,
          # then refused connections by the time the tests ran (F431). Detach
          # it into its own session and keep its log for the failure dump.
          setsid nohup node dist/server.js > /tmp/backend.log 2>&1 < /dev/null &
          echo $! > /tmp/backend.pid

      - name: Wait for backend
        run: npx wait-on http://localhost:5000/api/health/live --timeout 30000

      - name: Build frontend
        run: cd frontend && VITE_API_URL=http://localhost:5000 npm run build

      - name: Start frontend preview
        run: |
          cd frontend
          setsid nohup npx vite preview --port 5173 --host > /tmp/frontend.log 2>&1 < /dev/null &
          echo $! > /tmp/frontend.pid

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173 --timeout 30000

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Server logs on failure
        if: failure()
        run: |
          for f in /tmp/backend.log /tmp/frontend.log; do
            echo "::group::$f"; tail -n 200 "$f" 2>/dev/null || echo "(missing)"; echo "::endgroup::"
          done
          for f in /tmp/backend.pid /tmp/frontend.pid; do
            pid=$(cat "$f" 2>/dev/null) && { kill -0 "$pid" 2>/dev/null && echo "$f: $pid alive" || echo "$f: $pid gone"; }
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7
