name: OpenCode bwrap egress

on:
  pull_request:
    paths:
      - 'cli/src/lib/adapters/opencode.js'
      - 'cli/src/lib/provider-proxy.js'
      - 'cli/src/lib/instance-proxy.js'
      - 'cli/src/lib/sandbox/bwrap.js'
      - 'cli/src/lib/sandbox/opencode-loopback.mjs'
      - 'commonly-mcp/**'
      - 'packages/seats/**'   # opencode.js loads it (cli depends on file:../packages/seats)
      - 'cli/__tests__/opencode.bwrap-egress.test.mjs'
      - 'cli/__tests__/instance-proxy.test.mjs'
      - 'scripts/fixtures/opencode-mcp-probe.mjs'
      - 'scripts/verify-opencode-bwrap-mcp.mjs'
      - '.github/workflows/opencode-bwrap-egress.yml'

permissions:
  contents: read

jobs:
  isolated-egress:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise provider and Commonly MCP in a disposable namespace
        run: |
          docker run --rm --privileged --security-opt apparmor=unconfined \
            --mount "type=bind,src=$PWD,dst=/source,readonly" node:22 bash -lc '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq bubblewrap iproute2 >/dev/null
              mkdir -p /work/packages
              cp -R /source/cli /source/commonly-mcp /source/scripts /work/
              # cli links file:../packages/seats, so npm ci needs the link target.
              cp -R /source/packages/seats /work/packages/
              rm -rf /work/cli/node_modules /work/commonly-mcp/node_modules
              npm ci --prefix /work/cli --silent
              npm ci --prefix /work/commonly-mcp --silent
              chown -R node:node /work
              su node -s /bin/bash -c "cd /work/cli && COMMONLY_REQUIRE_BWRAP_SMOKE=1 node --experimental-vm-modules node_modules/.bin/jest __tests__/opencode.bwrap-egress.test.mjs __tests__/instance-proxy.test.mjs --runInBand"
              su node -s /bin/bash -c "node /work/scripts/verify-opencode-bwrap-mcp.mjs"
            '
