name: Secret Scan

on:
  push:
    branches: [ main, v1.0.x ]
  # No branches filter: a stacked PR skipping SECRET scan is a worse gap
  # than skipping tests (sprint-review's fold-in on #1123; see tests.yml).
  pull_request:

permissions:
  contents: read

# Push fallback is github.sha, not github.ref — see the long note in tests.yml.
# This workflow is push-triggered too, so it had the same collapse: 9 of 40
# runs on main cancelled by the next merge. A secret scan that gets cancelled
# is the one result you least want to read as "fine".
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retried, and checked against the release's published checksums
          # before use. The job token goes along because a GitHub incident once
          # named unauthenticated users; whether it helps is unproven. curl
          # drops the header on the redirect to the asset host.
          curl -sSfL --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks (all our branch commits)
        run: |
          # Scan the full history of our branches, not --all.
          # ~2,600 commits, ~20s. Catches historical leaks in our own code.
          #
          # Name the commits; don't pattern-match them. `--remotes=origin/main`
          # is a glob that git extends to origin/main/*, so it matched nothing.
          # A push still scanned, through the checked-out branch in --branches,
          # but a pull request checks out a detached merge commit with no local
          # branch, and every PR scan reported "0 commits scanned" and passed.
          # HEAD is that merge commit on a PR, and the pushed branch on a push.
          #
          # A scan of nothing still prints "no leaks found", so an empty input
          # fails here instead (review checklist rule 56).
          n=$(git rev-list --count HEAD origin/main origin/v1.0.x)
          echo "commits to scan: $n"
          [ "$n" -gt 0 ] || { echo "::error::Secret Scan has 0 commits to scan"; exit 1; }
          gitleaks detect --source . --config .gitleaks.toml --redact -v \
            --log-opts="HEAD origin/main origin/v1.0.x"
