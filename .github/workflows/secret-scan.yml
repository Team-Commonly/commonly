name: Secret Scan

on:
  push:
    branches: [ main, v1.0.x ]
  # No branches filter: a stacked PR skipping SECRET scan is a worse gap
  # than skipping tests (sprint-review's fold-in on #1123; see tests.yml).
  pull_request:

permissions:
  contents: read

# Push fallback is github.sha, not github.ref — see the long note in tests.yml.
# This workflow is push-triggered too, so it had the same collapse: 9 of 40
# runs on main cancelled by the next merge. A secret scan that gets cancelled
# is the one result you least want to read as "fine".
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # ONE-TIME AUDIT, not for merge: until #2389, PR scans covered 0 commits,
      # so commits that live only on a branch or a PR head were never scanned.
      # This run scans every remote head plus every refs/pull/*/head. It prints
      # commit, file and rule only, never the value.
      - name: Fetch every pull-request head
        run: git fetch -q origin '+refs/pull/*/head:refs/remotes/pr/*'

      - name: Audit gitleaks over every remote head and PR head
        run: |
          echo "refs: $(git for-each-ref refs/remotes | wc -l)"
          echo "commits: $(git rev-list --remotes | wc -l)"
          gitleaks detect --source . --config .gitleaks.toml --redact \
            --report-format json --report-path /tmp/audit.json \
            --log-opts="--remotes" || true
          echo "findings: $(jq length /tmp/audit.json)"
          jq -r '.[] | "\(.Commit[0:12]) \(.File) \(.RuleID)"' /tmp/audit.json | sort -u
          test "$(jq length /tmp/audit.json)" = 0
