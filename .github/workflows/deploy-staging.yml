name: Deploy Staging

# Staging is a second Compose project on the prod VM, stopped by default
# (docs/deployment/vm-staging.md). The reckless, fast lane: every merge to main —
# on push, or via workflow_dispatch pinned to main — builds the images, starts
# staging at this SHA, runs the Tier-1 and stranger smokes against it, records the
# `staging-smoke` commit status that Build VM Images gates prod on, and stops
# staging again. A workflow_dispatch from any OTHER ref fails WIF auth (the
# binding trusts only refs/heads/main), and the VM side refuses a SHA that is not
# on main.
#
# The runner reaches the VM over an IAP tunnel and logs in as a user whose key
# can run exactly one root script (deploy/vm/staging/ci-entry.sh): up <sha>,
# journey, down, status. It cannot run anything else on the VM.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref / SHA to build + deploy to staging (defaults to the triggering ref)'
        required: false
        default: ''
  push:
    branches: [ main ]

permissions:
  id-token: write     # OIDC token for google-github-actions/auth
  contents: read
  statuses: write     # post the staging-smoke commit status

concurrency:
  group: deploy-staging
  # One staging on one VM: a newer push QUEUES behind the in-flight run, so a run is
  # never cut off between `up` and its `down`.
  cancel-in-progress: false

env:
  REGION: us-central1
  AR_REPO: docker

jobs:
  deploy:
    name: Build + push + staging smoke on the VM
    runs-on: ubuntu-latest
    environment: staging
    # Builds ~10m, up <= 20m (staging.sh bounds pull 5m + compose up 10m + ready
    # 2.5m), Tier-1 <= 15m, journey <= 16m, down <= 5m.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Compute tag + full SHA of the checked-out ref
        id: tag
        run: |
          echo "tag=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Export PROJECT_ID from secret
        env:
          DEV_GCP_PROJECT_ID: ${{ secrets.DEV_GCP_PROJECT_ID }}
        run: echo "PROJECT_ID=${DEV_GCP_PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      # One frontend image per SHA: frontend:<sha8>-staging
      # (REACT_APP_API_URL=api-staging.commonly.me) — what commonly-staging runs.
      # We deliberately do NOT push the shared prod tag frontend:<sha8>: this job's
      # `environment: staging` carries no DEV_SENTRY_FRONTEND_DSN, so a prod variant
      # built here would differ from the one deploy-dev builds under the SAME tag (a
      # different-inputs collision; the two workflows' separate concurrency groups do
      # NOT serialize the writers). The promotion path that would justify a shared
      # artifact (deploy-dev promote_sha reusing a staging-verified build) does not
      # exist yet — reintroduce the shared-tag prod build only once it does, with
      # enforced input parity.
      - name: Build + push backend image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          REPO=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/commonly-backend
          docker build backend -t "$REPO:$TAG"
          docker push "$REPO:$TAG"

      - name: Build + push commonly-bot image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          REPO=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/commonly-bot
          docker build external/commonly-agent-services -t "$REPO:$TAG"
          docker push "$REPO:$TAG"

      - name: Build + push frontend image (staging variant)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REACT_APP_SENTRY_DSN: ${{ secrets.DEV_SENTRY_FRONTEND_DSN }}
        run: |
          REPO=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/commonly-frontend
          # Staging variant only (-staging tag). The shared prod tag frontend:<sha8> is
          # NOT pushed from staging (see the note above): it would collide with
          # deploy-dev's same-tag build on a differing Sentry DSN, and no promotion path
          # consumes it yet.
          docker build frontend --build-arg REACT_APP_API_URL=https://api-staging.commonly.me \
            --build-arg REACT_APP_SHOWCASE_POD_ID=6a507c9b792f1ed2cbfec648 \
            --build-arg REACT_APP_COMMUNITY_POD_ID=6a5fe677306155f677c26abf \
            --build-arg REACT_APP_COMMUNITY_INVITE_TOKEN=7b91255f18ae3c0ae3721707a6613731 \
            --build-arg REACT_APP_TELEGRAM_BOT_HANDLE=Commonly240Bot \
            --build-arg "REACT_APP_VERSION=$TAG" \
            --build-arg "REACT_APP_SENTRY_DSN=$REACT_APP_SENTRY_DSN" \
            -t "$REPO:$TAG-staging"
          docker push "$REPO:$TAG-staging"

      # IAP tunnel to the VM's sshd; the VM has no external address.
      - name: Open the tunnel to the VM
        env:
          VM: ${{ vars.STAGING_VM_INSTANCE }}
          ZONE: ${{ vars.STAGING_VM_ZONE }}
          SSH_KEY: ${{ secrets.STAGING_VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in VM ZONE SSH_KEY KNOWN_HOSTS; do
            [ -n "${!v:-}" ] || { echo "::error title=staging VM::$v is not set (vars STAGING_VM_INSTANCE/ZONE, secrets STAGING_VM_SSH_KEY/KNOWN_HOSTS)"; exit 1; }
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          nohup gcloud compute start-iap-tunnel "$VM" 22 --zone "$ZONE" --project "$PROJECT_ID" \
            --local-host-port=localhost:2222 > "$RUNNER_TEMP/ssh/tunnel.log" 2>&1 &
          # A listening port only proves gcloud is up; ssh-keyscan proves IAP let us through to sshd.
          for _ in $(seq 1 30); do
            if ssh-keyscan -T 5 -p 2222 -t ed25519 localhost 2>/dev/null | grep -q ssh-ed25519; then echo "tunnel open"; exit 0; fi
            sleep 2
          done
          echo "::error title=staging VM::the IAP tunnel did not open"; cat "$RUNNER_TEMP/ssh/tunnel.log"; exit 1

      - name: Start staging at this SHA
        id: up
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          timeout 20m ssh -i "$RUNNER_TEMP/ssh/key" -p 2222 \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o BatchMode=yes \
            staging-ci@localhost "up $SHA"

      # Tier-1 UI smoke (Playwright): health/ready, seeded non-admin login, /v2 home + a pod +
      # /v2/connectors + Bring-your-own render with no console errors, left rail no horizontal
      # scroll at 1440 & 390px. Its outcome is half of the staging-smoke status posted below, so
      # a red run blocks the prod roll. It caught the FRONTEND_URL/CORS regression on 2026-10-23.
      - name: Tier-1 UI smoke (Playwright)
        id: tier1
        timeout-minutes: 15
        env:
          SMOKE_BASE: https://staging.commonly.me
          SMOKE_API: https://api-staging.commonly.me
          SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          SMOKE_PW: ${{ secrets.STAGING_SMOKE_PW }}
          SMOKE_FRESH_EMAIL: ${{ secrets.STAGING_SMOKE_FRESH_EMAIL }}
          SMOKE_FRESH_PW: ${{ secrets.STAGING_SMOKE_FRESH_PW }}
          # F437: provision + tear down one hosted agent. Blocking since it passed on
          # 6 straight staging deploys (2026-11-14), so a hosted 503 now stops the roll.
          SMOKE_HOSTED: '1'
          SMOKE_HOSTED_BLOCKING: '1'
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_EMAIL:-}" ] || [ -z "${SMOKE_PW:-}" ] || [ -z "${SMOKE_FRESH_EMAIL:-}" ] || [ -z "${SMOKE_FRESH_PW:-}" ]; then
            echo "::error title=Tier-1 smoke::STAGING_SMOKE_EMAIL/PW and STAGING_SMOKE_FRESH_EMAIL/PW repo secrets must all be set (the connectors-fold check fails closed without the fresh account)"
            exit 1
          fi
          # Run in Playwright's image, which ships Chromium and its system deps,
          # so the smoke never runs apt: an Ubuntu mirror outage on 2026-11-11
          # failed `playwright install --with-deps` for hours and blocked every
          # roll (F431). The tag must equal the playwright pin in
          # scripts/staging-smoke/package.json; bump the tag and digest together.
          # `-e NAME` passes the step's env through without echoing values.
          docker run --rm --ipc=host \
            -v "$PWD/scripts/staging-smoke:/smoke" -w /smoke \
            -e SMOKE_BASE -e SMOKE_API -e SMOKE_EMAIL -e SMOKE_PW \
            -e SMOKE_FRESH_EMAIL -e SMOKE_FRESH_PW -e SMOKE_HOSTED -e SMOKE_HOSTED_BLOCKING \
            mcr.microsoft.com/playwright:v1.48.2-noble@sha256:c43809dabac73ac46b136409daa0a7d5411fb3ccc1e7d0fad1be5383a7a0f6ef \
            sh -c 'want=$(node -p "require(\"./package.json\").dependencies.playwright"); if [ "$want" != "1.48.2" ]; then echo "::error::scripts/staging-smoke pins playwright $want but the smoke image is v1.48.2; bump the image tag and digest in deploy-staging.yml"; exit 1; fi; npm install --no-audit --no-fund --silent && node staging-smoke.mjs'

      # The stranger journey (signup -> welcome -> question -> connect card) against
      # staging's public API, run on the VM so it can read staging's email sink. Its
      # pass/fail is half of the staging-smoke gate.
      - name: Stranger journey
        id: journey
        run: |
          set -euo pipefail
          timeout 16m ssh -i "$RUNNER_TEMP/ssh/key" -p 2222 \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o BatchMode=yes \
            staging-ci@localhost journey

      # staging-smoke = success only when staging came up at this SHA and both smokes
      # passed. `!cancelled()`: a cancelled run deployed nothing it can vouch for and
      # posts nothing, which blocks the prod roll exactly like a red status would.
      - name: Post the staging-smoke commit status
        if: ${{ !cancelled() }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
          UP: ${{ steps.up.outcome }}
          TIER1: ${{ steps.tier1.outcome }}
          JOURNEY: ${{ steps.journey.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          STATE=failure
          if [ "$UP" = success ] && [ "$TIER1" = success ] && [ "$JOURNEY" = success ]; then STATE=success; fi
          DESC="VM staging: up=$UP tier1=$TIER1 journey=$JOURNEY ($TAG)"
          echo "staging-smoke = $STATE for $SHA: $DESC"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$STATE" -f context="staging-smoke" -f description="$DESC" >/dev/null || exit 1
          [ "$STATE" = success ]

      # Stopped by default: always take staging down again, even after a failure,
      # so it holds no VM memory between runs. Volumes (its data) are kept.
      - name: Stop staging
        if: ${{ always() && steps.up.outcome != 'skipped' }}
        run: |
          timeout 5m ssh -i "$RUNNER_TEMP/ssh/key" -p 2222 \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -o BatchMode=yes staging-ci@localhost down \
            || echo "::warning title=staging VM::down failed; staging may still be running. Run staging.sh down on the VM."
