name: MCP on Windows

# The Bring your own page's Windows MCP lines (npm i -g @commonlyai/mcp, then
# `cmd /c commonly-mcp` under Claude Code), run on a real Windows host: the
# server must answer initialize, list its tools, and reach the API with its
# token. Run against the published package and this checkout's, and then
# through Claude Code itself: the page's own `claude mcp add` line, then
# `claude mcp list` must say Connected. The lines come from V2AgentBYO.tsx.

on:
  pull_request:
    paths:
      - 'commonly-mcp/**'
      - 'frontend/src/v2/components/V2AgentBYO.tsx'
      - '.github/workflows/mcp-windows.yml'
  workflow_dispatch:
  # Daily, so the @latest leg sees a new Claude Code release within a day even
  # when nothing here changes (F107).
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  mcp:
    runs-on: windows-latest
    timeout-minutes: 15
    # The pinned leg is the gate. The @latest leg is an early warning: it never
    # blocks a PR, and a red one means a Claude Code release broke the page's
    # line, so bump the pin only once the page works with it (F107).
    continue-on-error: ${{ matrix.claude_code == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        claude_code: ['pinned', 'latest']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The page's Windows MCP path answers
        env:
          COMMONLY_SMOKE_CLAUDE_CODE: ${{ matrix.claude_code == 'latest' && 'latest' || '' }}
        run: node commonly-mcp/scripts/windows-mcp-smoke.mjs
