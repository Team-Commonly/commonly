name: MCP on Windows

# The Bring your own page's Windows MCP lines (npm i -g @commonlyai/mcp, then
# `cmd /c commonly-mcp` under Claude Code), run on a real Windows host: the
# server must answer initialize, list its tools, and reach the API with its
# token. Run against the published package and this checkout's, and then
# through Claude Code itself: the page's own `claude mcp add` line, then
# `claude mcp list` must say Connected. The lines come from V2AgentBYO.tsx.

on:
  pull_request:
    paths:
      - 'commonly-mcp/**'
      - 'frontend/src/v2/components/V2AgentBYO.tsx'
      - '.github/workflows/mcp-windows.yml'
  workflow_dispatch:
  # Daily, so the @latest leg sees a new Claude Code release within a day even
  # when nothing here changes (F107).
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  mcp:
    runs-on: windows-latest
    timeout-minutes: 15
    # The pinned leg is the gate. The @latest leg is an early warning: a red one
    # means a Claude Code release broke the page's line, so fix the page, then
    # bump the pin (F107). On a PR it doesn't block, because the PR didn't cause
    # it. On the daily schedule it fails the run for real, since job-level
    # continue-on-error reports a failed job as green and nobody would see it.
    continue-on-error: ${{ matrix.claude_code == 'latest' && github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        claude_code: ['pinned', 'latest']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The page's Windows MCP path answers
        env:
          COMMONLY_SMOKE_CLAUDE_CODE: ${{ matrix.claude_code == 'latest' && 'latest' || '' }}
        run: node commonly-mcp/scripts/windows-mcp-smoke.mjs
      # A tolerated red still shows: an error annotation on the run and a line in
      # its summary, so a PR author sees a Claude Code release broke the page.
      - name: Say a Claude Code release broke the page's line
        if: failure() && matrix.claude_code == 'latest'
        shell: bash
        run: |
          msg="Claude Code @latest can't run the Bring your own page's Windows MCP line. Fix the page (V2AgentBYO.tsx), then bump CLAUDE_CODE_PINNED in commonly-mcp/scripts/windows-mcp-smoke.mjs."
          echo "::error title=Claude Code @latest broke the Windows MCP line::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
