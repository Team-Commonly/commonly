name: microsandbox Windows probe

# One question: can a free GitHub-hosted Windows runner boot a microsandbox
# microVM? microsandbox needs the Windows Hypervisor Platform (WHP). It runs on
# pushes to its own spike branch and by hand. It isn't a required check, uses
# no secrets, and is never meant to merge as is.
on:
  push:
    branches: [stack/microsandbox-win]
    paths: [.github/workflows/microsandbox-windows-probe.yml, scripts/spikes/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MSB_VERSION: v0.8.1
      # From the release's own checksums.sha256.
      MSB_ZIP_SHA256: b0f57ecbe7ad2abcc30e0dd9aa39de6c5cf31b0824c2b1cf6d4387d1fe88cde2
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: What virtualization does this runner have?
        continue-on-error: true
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption) $($os.Version)"
          $cs = Get-CimInstance Win32_ComputerSystem
          "HypervisorPresent: $($cs.HypervisorPresent)  Model: $($cs.Model)"
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          "CPU: $($cpu.Name)  VirtualizationFirmwareEnabled: $($cpu.VirtualizationFirmwareEnabled)  SLAT: $($cpu.SecondLevelAddressTranslationExtensions)"
          foreach ($f in 'HypervisorPlatform', 'Microsoft-Hyper-V', 'VirtualMachinePlatform') {
            $s = Get-WindowsOptionalFeature -Online -FeatureName $f -ErrorAction SilentlyContinue
            "Feature ${f}: $($s.State)"
          }
          "-- systeminfo Hyper-V lines"
          systeminfo | Select-String -Pattern 'Hyper-V|hypervisor|Virtualization' | ForEach-Object { $_.Line.Trim() }

      - name: Install the pinned release (checksum-verified, no install script)
        run: |
          $zip = "$env:RUNNER_TEMP\msb.zip"
          Invoke-WebRequest -Uri "https://github.com/superradcompany/microsandbox/releases/download/$env:MSB_VERSION/microsandbox-windows-x86_64.zip" -OutFile $zip
          $sum = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne $env:MSB_ZIP_SHA256) { throw "checksum mismatch: $sum" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\msb"
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\msb" | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          $exe = Get-ChildItem -Recurse "$env:RUNNER_TEMP\msb" -Filter msb.exe | Select-Object -First 1
          if (-not $exe) { throw "msb.exe not in the archive" }
          "MSB=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
          & $exe.FullName --version

      - name: Boot a microVM
        continue-on-error: true
        timeout-minutes: 8
        run: |
          & $env:MSB --help | Select-Object -First 30
          "-- msb run python"
          & $env:MSB run python -- python3 -c "print('hello from a microVM')"
          "exit: $LASTEXITCODE"

      - name: Fence, driver contract and agents (scripts/spikes/microsandbox-probe.ps1)
        continue-on-error: true
        timeout-minutes: 20
        run: ./scripts/spikes/microsandbox-probe.ps1
