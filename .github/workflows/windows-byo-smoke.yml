# Scratch check, never merged to main: does the Bring-your-own path for
# Claude Code work on Windows PowerShell with a per-user npm prefix (no
# admin)? Run 1 (published CLI 0.1.105) is in this branch's history; this
# run installs #2288's CLI from its branch and probes the MCP server start.
name: Windows BYO smoke (scratch)

on:
  push:
    branches: [lily/windows-byo-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # Windows PowerShell 5.1: what a company-managed laptop opens.
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/windows-byo-smoke

      - name: Check out the CLI from the fix branch
        uses: actions/checkout@v4
        with:
          ref: lily/cli-host-sandbox-preflight
          path: fix
          sparse-checkout: cli

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Per-user npm prefix (no admin)
        run: |
          $prefix = Join-Path $env:APPDATA 'npm-user'
          New-Item -ItemType Directory -Force $prefix | Out-Null
          npm config set prefix $prefix
          Add-Content -Path $env:GITHUB_PATH -Value $prefix

      - name: Install the fix branch's CLI from its packed tarball
        run: |
          Push-Location fix\cli
          $tgz = (npm pack --silent | Select-Object -Last 1)
          Pop-Location
          npm i -g (Join-Path 'fix\cli' $tgz) | Out-Host
          commonly --version

      - name: Claude Code native installer (claude.exe)
        run: |
          irm https://claude.ai/install.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.local\bin')

      - name: Listener on native Windows with the fix (expect a stop with directions)
        continue-on-error: true
        run: .\.github\windows-byo-smoke\run-agent.ps1 -Label fix-native-exe -Seconds 20

      - name: MCP server start, cmd /c npx (what Claude Code spawns)
        continue-on-error: true
        run: node .\.github\windows-byo-smoke\mcp-probe.mjs cmd.exe /c npx -y '@commonlyai/mcp'

      - name: MCP server start, npx with no cmd /c (expect ENOENT)
        continue-on-error: true
        run: node .\.github\windows-byo-smoke\mcp-probe.mjs npx -y '@commonlyai/mcp'

      - name: MCP through Claude Code, cmd /c npx, health check
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          claude mcp add commonly -e COMMONLY_API_URL=https://api.commonly.me -e COMMONLY_AGENT_TOKEN=cm_agent_windows_smoke_not_a_real_token -- cmd /c npx -y '@commonlyai/mcp'
          claude mcp list
          claude mcp list
          claude mcp remove commonly
