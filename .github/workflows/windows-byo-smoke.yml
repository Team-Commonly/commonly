# Scratch check, never merged to main: does the Bring-your-own path for
# Claude Code work on Windows PowerShell with a per-user npm prefix (no
# admin)? Runs 1 and 2 are in this branch's history; run 3 measures the MCP
# connection's first, cold start and a pre-installed variant.
name: Windows BYO smoke (scratch)

on:
  push:
    branches: [lily/windows-byo-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # Windows PowerShell 5.1: what a company-managed laptop opens.
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/windows-byo-smoke

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Per-user npm prefix (no admin)
        run: |
          $prefix = Join-Path $env:APPDATA 'npm-user'
          New-Item -ItemType Directory -Force $prefix | Out-Null
          npm config set prefix $prefix
          Add-Content -Path $env:GITHUB_PATH -Value $prefix

      - name: Claude Code native installer (claude.exe)
        run: |
          irm https://claude.ai/install.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.local\bin')

      - name: MCP, cold npx cache, the line as a person pastes it
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          claude mcp add commonly -e COMMONLY_API_URL=https://api.commonly.me -e COMMONLY_AGENT_TOKEN=cm_agent_windows_smoke_not_a_real_token -- cmd /c npx -y @commonlyai/mcp
          $t = Measure-Command { claude mcp list | Out-Host }
          Write-Output ("first health check took {0:N1}s" -f $t.TotalSeconds)
          $t = Measure-Command { claude mcp list | Out-Host }
          Write-Output ("second health check took {0:N1}s" -f $t.TotalSeconds)
          claude mcp remove commonly

      - name: MCP, installed first (npm i -g), then cmd /c commonly-mcp
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          npm i -g @commonlyai/mcp | Out-Host
          Get-Command commonly-mcp -All | Format-Table CommandType, Source -AutoSize
          claude mcp add commonly -e COMMONLY_API_URL=https://api.commonly.me -e COMMONLY_AGENT_TOKEN=cm_agent_windows_smoke_not_a_real_token -- cmd /c commonly-mcp
          $t = Measure-Command { claude mcp list | Out-Host }
          Write-Output ("health check took {0:N1}s" -f $t.TotalSeconds)
          claude mcp remove commonly
