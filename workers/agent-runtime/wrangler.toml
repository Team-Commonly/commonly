# ADR-023 W2: the hosted agent runtime. One Durable Object per
# (agentName, instanceId); sessions on DO storage; tools as CAP calls.
# Deploy is operator/CI-side (Cloudflare account is operator-private).
name = "commonly-agent-runtime"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentRuntimeDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentRuntimeDO"]

[vars]
# The Commonly instance this runtime serves. Runtime tokens come per-agent
# via the provision call, never from worker config.
COMMONLY_API_URL = "https://api.commonly.me"
# Provider decision 2026-08-29 (Sam): DeepSeek. Key is a secret (DEEPSEEK_API_KEY).
MODEL_PROVIDER = "deepseek"

# Staging env (added 2026-11-01): a separate worker serving the staging Commonly
# instance at api-staging.commonly.me. A named Cloudflare env inherits neither
# bindings, vars NOR secrets, so the AGENT binding and vars are repeated here and
# BOTH secrets must be set per-env; the top-level [[migrations]] applies to every env.
# Deploy is operator/CI-side (see the header): `wrangler deploy --env staging`, then
# two `wrangler secret put ... --env staging` piped from staging Secret Manager so
# nothing is typed by hand:
#   RUNTIME_ADMIN_TOKEN  <- commonly-staging-hosted-runtime-admin-token (gates provision)
#   DEEPSEEK_API_KEY     <- commonly-deepseek-api-key (MODEL_PROVIDER=deepseek; a turn
#                           throws "DEEPSEEK_API_KEY unset" without it, so hosted-reply
#                           would fail even once provision succeeds)
[env.staging]
name = "commonly-agent-runtime-staging"

[[env.staging.durable_objects.bindings]]
name = "AGENT"
class_name = "AgentRuntimeDO"

[env.staging.vars]
COMMONLY_API_URL = "https://api-staging.commonly.me"
MODEL_PROVIDER = "deepseek"
