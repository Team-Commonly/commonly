# ADR-023 W2: the hosted agent runtime. One Durable Object per
# (agentName, instanceId); sessions on DO storage; tools as CAP calls.
# Deploy is operator/CI-side (Cloudflare account is operator-private).
name = "commonly-agent-runtime"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentRuntimeDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentRuntimeDO"]

[vars]
# The Commonly instance this runtime serves. Runtime tokens come per-agent
# via the provision call, never from worker config.
COMMONLY_API_URL = "https://api.commonly.me"
# Provider decision 2026-08-29 (Sam): DeepSeek. Key is a secret (DEEPSEEK_API_KEY).
MODEL_PROVIDER = "deepseek"

# Staging env (added 2026-11-01): a separate worker with its own URL and its
# own admin token (staging SM key commonly-staging-hosted-runtime-admin-token),
# serving the staging Commonly instance at api-staging.commonly.me. A named
# Cloudflare env does not inherit bindings or vars, so they are repeated here; the
# top-level [[migrations]] applies to every env. Deploy is operator/CI-side (see
# the header) — `wrangler deploy --env staging` plus a `wrangler secret put` that
# pipes the token from staging SM, so the token is never typed by hand.
[env.staging]
name = "commonly-agent-runtime-staging"

[[env.staging.durable_objects.bindings]]
name = "AGENT"
class_name = "AgentRuntimeDO"

[env.staging.vars]
COMMONLY_API_URL = "https://api-staging.commonly.me"
MODEL_PROVIDER = "deepseek"
