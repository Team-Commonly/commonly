# The API load balancer for two backend processes (the `two-workers` compose
# profile). Runbook: docs/deployment/two-backend-workers.md.
#
# Off until SRE rolls it: with the profile on, the tunnel's API hostname points
# here (http://api-lb:5000) instead of at the backend.
#
# What it must keep:
# - The end user's address. Cloudflare's CF-Connecting-IP, which every
#   internet-facing rate limiter keys on first (middleware/ipRateLimit.ts),
#   passes through untouched: nginx forwards a client's headers as they came
#   unless a proxy_set_header line names them, and none here does.
#   X-Forwarded-For is appended to, never replaced, so req.ip still resolves to
#   the end user behind the backend's trusted private-range proxies.
# - One process per browser. socket.io's polling transport keeps its session in
#   one process, so requests stick to a backend by the end user's address,
#   consistently, so a backend leaving or joining moves only its own users.
# - Service when one backend is gone. A refused or timed-out connection, a 502
#   or a 503 moves the request to the other backend. backend-2 drops out of
#   Docker's DNS when it stops (it stops itself on losing Redis), and `resolve`
#   drops it from the pool instead of failing this proxy's start.
# - Parity with the tunnel's direct path: no body cap (the backend enforces its
#   own), no response buffering (streams), long reads (long polls, sockets).
# Pinned by backend/__tests__/unit/deployment/singleVmCompose.test.js.

worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  # The backend logs every request itself (middleware/accessLog).
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;

  # Docker's embedded DNS, re-read often so a restarted backend is found.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Every request through the tunnel carries CF-Connecting-IP. One without it
  # (a probe on the compose network) sticks by its peer instead.
  map $http_cf_connecting_ip $sticky_key {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
  }

  upstream backend_pool {
    zone backend_pool 64k;
    hash $sticky_key consistent;
    server backend:5000 resolve max_fails=1 fail_timeout=10s;
    server backend-2:5000 resolve max_fails=1 fail_timeout=10s;
  }

  server {
    listen 5000;
    client_max_body_size 0;

    location = /lb-health {
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Only before a request body is sent: a POST is never replayed.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 3s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
